<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lesson 6: Transport in Animals</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
<style>/* ============================================================
   base.css — khung thiết kế cố định cho bài giảng HTML tương tác
   KHÔNG sửa file này cho từng bài. Ghi đè bằng theme.css nếu cần.
   Chỉ 3 biến được phép đổi theo chủ đề bài: --accent, --accent-2, --bg-base
   ============================================================ */

:root {
  /* --- màu: nền sáng ấm, thân thiện học sinh nhỏ tuổi --- */
  --bg-base: #FFF9F0;
  --bg-panel: #FFFFFF;
  --bg-panel-2: #FFF3E4;
  --accent: #FB923C;          /* đổi theo chủ đề bài */
  --accent-2: #34D399;        /* màu bổ trợ: thưởng, khen, confetti */
  --accent-soft: color-mix(in srgb, var(--accent) 14%, white);
  --accent2-soft: color-mix(in srgb, var(--accent2, #FBBF24) 18%, white);
  --text-primary: #2D2A26;
  --text-muted: #6B6259;
  --ok: #16A34A;
  --bad: #E11D48;
  --line: color-mix(in srgb, var(--text-primary) 12%, transparent);

  /* --- hình khối --- */
  --radius: 18px;
  --radius-lg: 26px;
  --shadow: 0 6px 18px rgba(80, 60, 40, .12);
  --shadow-lg: 0 14px 36px rgba(80, 60, 40, .18);

  /* --- thang z-index cố định: mọi phần tử nổi CHỈ dùng biến này --- */
  --z-navbar: 100;
  --z-toast: 500;
  --z-drag: 600;              /* lớp nổi item đang kéo — trên navbar/stage, dưới lightbox/modal */
  --z-lightbox: 900;
  --z-modal: 1000;

  /* --- cỡ chữ: mọi font chính = calc(clamp(...) * var(--fs-scale)) --- */
  --fs-scale: 1;
  /* Trần clamp() cũ (44/30/24px) chặn cỡ chữ trên màn lớn: bảng 4K vẫn hiện chữ 24px,
     tức 1/90 chiều cao màn hình — không đọc được từ cuối lớp. Chuẩn trình chiếu lớp học:
     chữ nhỏ nhất >= 1/40 chiều cao màn hình. vh là trục chính, px chỉ làm sàn cho cửa sổ nhỏ. */
  --f-h1: calc(clamp(38px, 6.5vh, 130px) * var(--fs-scale));
  --f-h2: calc(clamp(34px, 5.4vh, 108px) * var(--fs-scale));
  --f-body: calc(clamp(32px, 4.2vh, 82px) * var(--fs-scale));
  --f-btn: calc(clamp(26px, 3.7vh, 74px) * var(--fs-scale));
  --f-small: calc(clamp(22px, 3.0vh, 60px) * var(--fs-scale));

  --navbar-h: clamp(56px, 8vh, 84px);
  --dur: .45s;
  --ease: cubic-bezier(.22, 1, .36, 1);
}

* { box-sizing: border-box; }

html, body {
  margin: 0; padding: 0;
  width: 100%; height: 100%;
  overflow: hidden;                 /* quy tắc cứng: không cuộn trang */
  background: var(--bg-base);
  color: var(--text-primary);
  font-family: 'Baloo 2', 'Quicksand', 'Nunito', -apple-system, 'Segoe UI', Roboto, sans-serif;
  font-size: var(--f-body);
  -webkit-text-size-adjust: 100%;
}

#app { display: flex; flex-direction: column; width: 100%; height: 100%; }

/* ===================== NAVBAR ===================== */
.navbar {
  flex: 0 0 auto;
  height: var(--navbar-h);
  z-index: var(--z-navbar);
  display: flex; align-items: center; gap: 10px;
  padding: 0 14px;
  background: var(--bg-panel);
  box-shadow: var(--shadow);
}
.navbar .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.navbar .brand img { height: calc(var(--navbar-h) * .62); width: auto; object-fit: contain; }
.navbar .spacer { flex: 1 1 auto; min-width: 0; }
.navbar .lesson-title {
  font-size: var(--f-small); color: var(--text-muted);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0;
}

.iconbtn {
  flex: 0 0 auto;
  display: flex; align-items: center; justify-content: center;
  width: calc(var(--navbar-h) * .66); height: calc(var(--navbar-h) * .66);
  border: none; border-radius: 999px;
  background: var(--accent-soft); color: var(--text-primary);
  cursor: pointer; font-size: var(--f-small);
  transition: transform .15s var(--ease), box-shadow .15s var(--ease);
}
@media (hover: hover) and (pointer: fine) {
  .iconbtn:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
}
.iconbtn:active { transform: scale(.88); background: var(--accent); color: #fff; }
.iconbtn svg { width: 55%; height: 55%; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.fs-group { display: flex; align-items: center; gap: 4px; }
.fs-group .fs-val { font-size: var(--f-small); min-width: 4ch; text-align: center; color: var(--text-muted); }

.stars { display: flex; align-items: center; gap: 6px; font-size: var(--f-small); font-weight: 700; }
.streak { font-size: var(--f-small); color: var(--accent); font-weight: 700; }

.progress {
  flex: 0 0 auto; height: 6px; width: 100%;
  background: color-mix(in srgb, var(--accent) 18%, white);
}
.progress > i {
  display: block; height: 100%; width: 0%;
  background: linear-gradient(90deg, var(--accent), var(--accent-2));
  transition: width .35s var(--ease);
}

/* ===================== STAGE =====================
   Lấp đầy 100% khung nhìn còn lại, sát mép 4 phía.
   CẤM: aspect-ratio cố định, border-radius, box-shadow, margin auto quanh stage. */
.stage {
  position: relative;
  flex: 1 1 auto;
  min-height: 0;
  width: 100%;
  overflow: hidden;
  /* KHÔNG đặt z-index ở đây: .stage là flex item nên z-index (dù không cần "position") sẽ tự tạo
     stacking context riêng, nhốt luôn item đang kéo (.dragging, z-index cao) bên trong — item sẽ
     không bao giờ nổi lên trên .navbar được. Để .stage vẽ sau navbar theo đúng thứ tự DOM là đủ. */
  padding: 0;
}
.slide {
  position: absolute; inset: 0;
  display: flex; flex-direction: column;
  gap: clamp(6px, 1.4vh, 16px);
  padding: clamp(10px, 2vh, 26px);
  overflow: hidden;
}

/* Ngân sách chiều cao: khối cố định = .fixed, khối nội dung chính = .grow */
.fixed { flex: 0 0 auto; min-height: 0; }
.grow  { flex: 1 1 auto; min-height: 0; min-width: 0; display: flex; flex-direction: column; }

/* Mọi flex/grid item chứa nội dung động phải co được */
.slide *, .slide *::before, .slide *::after { min-width: 0; }
.slide p, .slide li, .slide .txt, .slide .answer, .slide .word { overflow-wrap: break-word; }

/* Bọc trực tiếp SVG/canvas/ảnh co giãn trong flex căn giữa: LUÔN dùng .fill-w */
.fill-w { width: 100%; }
.center-col { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 0; min-width: 0; }
.center-col > .fill-w { width: 100%; }

/* Chuyển cảnh có hướng */
.slide.dir-next { animation: slideNext var(--dur) var(--ease) both; }
.slide.dir-prev { animation: slidePrev var(--dur) var(--ease) both; }
.slide.dir-jump { animation: fadeIn .3s var(--ease) both; }
@keyframes slideNext { from { opacity: 0; transform: translateX(48px) scale(.96);} to { opacity:1; transform:none; } }
@keyframes slidePrev { from { opacity: 0; transform: translateX(-48px) scale(.96);} to { opacity:1; transform:none; } }
@keyframes fadeIn { from { opacity: 0 } to { opacity: 1 } }

/* Stagger xuất hiện: gắn .stagger lên cha */
.stagger > * { animation: pop .42s var(--ease) both; }
.stagger > *:nth-child(1){animation-delay:.00s}.stagger > *:nth-child(2){animation-delay:.07s}
.stagger > *:nth-child(3){animation-delay:.14s}.stagger > *:nth-child(4){animation-delay:.21s}
.stagger > *:nth-child(5){animation-delay:.28s}.stagger > *:nth-child(6){animation-delay:.35s}
.stagger > *:nth-child(7){animation-delay:.42s}.stagger > *:nth-child(8){animation-delay:.49s}
@keyframes pop { from { opacity:0; transform: translateY(14px) scale(.94);} to { opacity:1; transform:none; } }

/* ===================== KHỐI NỘI DUNG ===================== */
.pill {
  display: flex; align-items: center; justify-content: center; text-align: center;
  gap: 10px; padding: .35em 1em; border-radius: 999px;
  background: var(--accent); color: #fff; font-size: var(--f-h2); font-weight: 700;
  box-shadow: var(--shadow);
}
.chip, .badge {
  display: flex; align-items: center; justify-content: center; text-align: center;
  padding: .3em .9em; border-radius: 999px; font-size: var(--f-small);
  background: var(--bg-panel-2); border: 2px solid var(--line);
}
.card {
  background: var(--bg-panel); border-radius: var(--radius-lg);
  box-shadow: var(--shadow); border: 2px solid var(--line);
  padding: clamp(10px, 2vh, 22px);
}
.h1 { font-size: var(--f-h1); font-weight: 800; margin: 0; text-align: center; }
.h2 { font-size: var(--f-h2); font-weight: 700; margin: 0; text-align: center; }
.txt { font-size: var(--f-body); margin: 0; }
.muted { color: var(--text-muted); font-size: var(--f-small); }

/* Lưới ảnh ví dụ: ô đều nhau, ảnh contain — không xếp ảnh theo kích thước gốc */
.imgrid { flex: 1 1 auto; min-height: 0; display: grid; gap: clamp(8px, 1.6vh, 18px); }
.imgrid > .cell {
  min-width: 0; min-height: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: clamp(2px, .5vh, 8px);
  background: var(--bg-panel); border-radius: var(--radius); border: 2px solid var(--line);
  box-shadow: var(--shadow);
  padding: clamp(4px, .8vh, 12px);   /* 8px cứng cũ ăn mất diện tích ảnh trên màn lớn */
  overflow: hidden;
}
/* Nhãn dưới ảnh không được nuốt chỗ của ảnh */
.imgrid > .cell > .chip, .imgrid > .cell > .badge { flex: 0 0 auto; }
/* height:100% chỉ ăn khi cha có chiều cao xác định; trong flex cao auto ảnh rơi về
   shrink-to-fit (~300x150px) -> "ảnh nhỏ xíu giữa khoảng trắng". flex + align-self:stretch
   cho ảnh nở hết khung trong CẢ grid lẫn flex, không phụ thuộc cha khai height. */
.imgrid img, .fitimg {
  flex: 1 1 auto; align-self: stretch;
  width: 100%; height: 100%;
  min-width: 0; min-height: 0;
  max-width: 100%; max-height: 100%;
  object-fit: contain;
}
/* Sàn kích thước cho ảnh minh hoạ chính — trình chiếu TV cuối lớp */
/* CŨ: min-height:28vh + max-height:100% -> khi khung chứa thấp hơn 28vh, CSS cho min-height
   thắng max-height, ảnh tràn ra ngoài khung -> đúng triệu chứng "bể hình"/tràn dọc.
   MỚI: flex-basis 34vh -> ảnh CỐ đạt 34vh và nở thêm nếu còn chỗ, nhưng vẫn co được khi
   thiếu chỗ, nên không bao giờ tràn. */
.hero-img {
  flex: 1 1 34vh; align-self: stretch;
  width: 100%; height: 100%;
  min-width: 0; min-height: 0; max-height: 100%;
  object-fit: contain;
}

/* ===================== NÚT ===================== */
.btnrow { flex: 0 0 auto; display: flex; align-items: center; justify-content: center; gap: clamp(8px, 1.6vh, 16px); flex-wrap: wrap; }
.btn {
  display: flex; align-items: center; justify-content: center; text-align: center; gap: .4em;
  font: inherit; font-size: var(--f-btn); font-weight: 700;
  padding: .5em 1.2em; border-radius: var(--radius-lg);
  border: 3px solid transparent; cursor: pointer;
  background: var(--bg-panel); color: var(--text-primary);
  box-shadow: var(--shadow);
  transition: transform .15s var(--ease), box-shadow .15s var(--ease), background .18s, border-color .18s;
}
@media (hover: hover) and (pointer: fine) {
  .btn:hover { transform: translateY(-3px); box-shadow: var(--shadow-lg); }
}
/* Phản hồi chạm phải THẤY ĐƯỢC TỪ CUỐI LỚP: bảng tương tác có độ trễ, phản hồi mờ nhạt
   khiến học sinh bấm lại nhiều lần. scale(.97) là quá tinh tế cho khoảng cách đó. */
.btn:active { transform: scale(.93); box-shadow: 0 0 0 6px var(--accent-soft), var(--shadow-lg); }
.btn[disabled] { opacity: .5; cursor: default; transform: none; }
.btn-check { background: var(--ok); color: #fff; }
.btn-show  { background: #FBBF24; color: #3A2A00; }
.btn-reset { background: var(--accent); color: #fff; }
.btn-primary { background: var(--accent); color: #fff; }
.btn-primary.pulse { animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 0%,100%{ box-shadow: var(--shadow) } 50%{ box-shadow: 0 0 0 12px color-mix(in srgb, var(--accent) 22%, transparent) } }

/* Trạng thái đúng/sai */
.is-ok  { border-color: var(--ok) !important;  background: color-mix(in srgb, var(--ok) 14%, white) !important; }
.is-bad { border-color: var(--bad) !important; background: color-mix(in srgb, var(--bad) 12%, white) !important; }
.shake { animation: shake .4s; }
@keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-7px)} 75%{transform:translateX(7px)} }
.ping::after {
  content:''; position:absolute; inset:0; border-radius:inherit;
  border:3px solid var(--accent-2); animation: ping .6s var(--ease) forwards;
}
@keyframes ping { to { transform: scale(1.35); opacity: 0; } }

/* Kéo-thả — dùng chung với ctx.draggable()/ctx.dragDrop() trong engine.js */
.drag-item { cursor: grab; touch-action: none; user-select: none; position: relative; }
.drag-item.dragging { cursor: grabbing; box-shadow: var(--shadow-lg); z-index: 999; }
.drag-item.picked { outline: 4px solid var(--accent); outline-offset: 3px; }         /* bấm-chọn dự phòng đang chờ thả */
.drag-item.locked { cursor: default; opacity: .85; }
.dd-tray { display: flex; flex-wrap: wrap; gap: clamp(8px,1.6vh,16px); align-content: flex-start; justify-content: center; }
.dd-zone { position: relative; transition: border-color .15s var(--ease), background .15s var(--ease), box-shadow .15s var(--ease); }
.bin { min-height: clamp(120px, 22vh, 240px); display: flex; flex-wrap: wrap; gap: 8px; align-content: flex-start; justify-content: center; }
.bins-row { display: flex; gap: clamp(8px,1.6vh,16px); align-items: stretch; min-height: clamp(120px, 22vh, 240px); }
.bin.over, .dd-zone.over {
  border-color: var(--accent) !important; background: var(--accent-soft) !important;
  box-shadow: 0 0 0 6px color-mix(in srgb, var(--accent) 20%, transparent);
}

/* Nhãn đúng/sai RÕ RÀNG: icon nổi trên item — không chỉ dựa vào màu viền/nền
   (an toàn cho học sinh mù màu, đọc được từ cuối lớp trên TV). Gắn qua ctx.markResult(). */
.fb-anchor { position: relative; }
.fb-badge {
  position: absolute; top: 6px; right: 6px; z-index: 3;
  width: clamp(34px, 5.4vh, 96px); height: clamp(34px, 5.4vh, 96px);
  border-radius: 999px; display: flex; align-items: center; justify-content: center;
  font-size: clamp(22px, 3.4vh, 60px); font-weight: 900; color: #fff; line-height: 1;
  border: 3px solid #fff; box-shadow: var(--shadow); pointer-events: none;
  animation: badgePop .35s var(--ease) both;
}
.fb-badge.ok  { background: var(--ok); }
.fb-badge.bad { background: var(--bad); }
@keyframes badgePop {
  from { transform: scale(0) rotate(-15deg); opacity: 0; }
  60%  { transform: scale(1.2) rotate(4deg); opacity: 1; }
  to   { transform: scale(1) rotate(0); }
}

/* Vùng game dễ tràn dọc */
.gamebox { justify-content: flex-start; overflow: auto; }

/* ===================== HOẠ TIẾT NỀN =====================
   QUAN TRỌNG: 2 class TÁCH RIÊNG.
   .float-anim  = THUẦN animation, an toàn cho mọi phần tử nội dung/nút.
   .bg-deco     = định vị tuyệt đối, CHỈ dùng cho hoạ tiết trang trí không tương tác. */
.float-anim { animation: floaty 3.6s ease-in-out infinite; }
@keyframes floaty { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
.bg-deco {
  position: absolute; pointer-events: none; opacity: .10; z-index: 0;
  animation: drift 26s linear infinite;
}
@keyframes drift { from{transform:translateX(-6vw)} to{transform:translateX(6vw)} }

/* ===================== LỚP NỔI ===================== */
/* Lớp nổi cho item đang kéo (xem ctx.draggable() trong engine.js): item được chuyển vào đây ngay
   lúc bắt đầu kéo để position:fixed luôn tính đúng theo viewport, không bị tổ tiên nào (transform/
   overflow của .stage khi chuyển slide) làm lệch. pointer-events:none để không chặn click khi rỗng —
   item con vẫn nhận sự kiện đầy đủ qua setPointerCapture bất kể pointer-events của lớp cha. */
#dragLayer { position: fixed; inset: 0; z-index: var(--z-drag); pointer-events: none; }

.toast {
  position: fixed; left: 50%; bottom: 4vh; transform: translateX(-50%);
  z-index: var(--z-toast); padding: .6em 1.2em; border-radius: 999px;
  background: var(--text-primary); color: #fff; font-size: var(--f-small);
  box-shadow: var(--shadow-lg); opacity: 0; transition: opacity .25s;
  pointer-events: none;   /* không bao giờ nuốt click của hàng nút nằm dưới */
}
.toast.on { opacity: 1; }

.lightbox {
  position: fixed; inset: 0; z-index: var(--z-lightbox);
  background: rgba(30,24,18,.86);
  display: none; align-items: center; justify-content: center; padding: 3vh;
}
.lightbox.on { display: flex; }
.lightbox img { max-width: 96%; max-height: 96%; object-fit: contain; border-radius: var(--radius); background: #fff; }
.zoomhint { font-size: var(--f-small); color: var(--text-muted); cursor: zoom-in; }

.modal {
  position: fixed; inset: 0; z-index: var(--z-modal);
  background: rgba(30,24,18,.5);
  display: none; align-items: center; justify-content: center; padding: 4vh;
}
.modal.on { display: flex; }
.modal .sheet {
  background: var(--bg-panel); border-radius: var(--radius-lg); box-shadow: var(--shadow-lg);
  padding: clamp(14px,2.5vh,28px); width: min(900px, 94vw);
  max-height: 90vh; overflow: auto;      /* modal ĐƯỢC phép cuộn nội bộ */
  display: flex; flex-direction: column; gap: 10px;
}
.menu-section { font-size: var(--f-small); color: var(--text-muted); font-weight: 700; margin-top: 8px; }
.menu-item {
  display: flex; align-items: center; gap: 10px; text-align: left;
  padding: .5em .8em; border-radius: var(--radius); border: 2px solid var(--line);
  background: var(--bg-panel-2); font-size: var(--f-small); cursor: pointer; font-family: inherit;
}
.menu-item.current { border-color: var(--accent); background: var(--accent-soft); }
.menu-item .num { flex: 0 0 auto; width: 2.2em; text-align: center; font-weight: 700; }

/* ===================== INTRO ===================== */
.intro {
  position: fixed; inset: 0; z-index: var(--z-modal);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2vh;
  background: linear-gradient(160deg, var(--bg-base), var(--accent-soft));
}
.intro .word { display: inline-block; animation: bounceIn .6s var(--ease) both; }
@keyframes bounceIn { 0%{opacity:0;transform:translateY(40px) scale(.6)} 60%{transform:translateY(-8px) scale(1.06)} 100%{opacity:1;transform:none} }
.skip { position: fixed; right: 2vh; bottom: 2vh; }

/* ===================== FLASHCARD 3D ===================== */
.fc-wrap { perspective: 1400px; display: flex; align-items: center; justify-content: center; flex: 1 1 auto; min-height: 0; width: 100%; }
.fc {
  position: relative; transform-style: preserve-3d; cursor: pointer;
  width: min(70vw, 58vh, 100%); height: min(60vh, 70vw, 100%);
  transition: transform .55s var(--ease);
}
.fc.flipped { transform: rotateY(180deg); }
.fc .face {
  position: absolute; inset: 0; backface-visibility: hidden;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
  background: var(--bg-panel); border: 3px solid var(--line);
  border-radius: var(--radius-lg); box-shadow: var(--shadow-lg); padding: 14px;
}
.fc .back { transform: rotateY(180deg); }
.fc-stack-under {
  position: absolute; inset: 0; border-radius: var(--radius-lg);
  background: var(--bg-panel); border: 3px solid var(--line); box-shadow: var(--shadow);
}
.dots { display: flex; gap: 8px; justify-content: center; flex: 0 0 auto; }
.dots i { width: 12px; height: 12px; border-radius: 999px; background: var(--line); display: block; }
.dots i.done { background: var(--accent-2); }
.dots i.now { background: var(--accent); box-shadow: 0 0 0 5px var(--accent-soft); }

/* karaoke highlight */
.kara { background: var(--accent-2); border-radius: 6px; padding: 0 .12em; }

/* ===================== CANVAS VẼ ===================== */
.drawwrap { flex: 1 1 auto; min-height: 0; width: 100%; display: flex; }
canvas.draw { width: 100%; height: 100%; touch-action: none; background: #fff; border-radius: var(--radius); border: 2px solid var(--line); }

/* ===================== HIT-TEST TRÊN ẢNH ===================== */
.hotwrap { position: relative; display: inline-flex; max-width: 100%; max-height: 100%; }
.hotwrap img { max-width: 100%; max-height: 100%; object-fit: contain; touch-action: none; }
.hotmark {
  position: absolute; transform: translate(-50%, -50%);
  width: 9%; aspect-ratio: 1; border-radius: 999px;
  border: 5px solid var(--ok); pointer-events: none;
}
.hotmark.bad { border-color: var(--bad); }

/* ===================== FALLBACK & A11Y ===================== */
@supports not (backdrop-filter: blur(1px)) { .card { background: var(--bg-panel); } }
.assetfail {
  display: flex; align-items: center; justify-content: center; text-align: center;
  background: var(--bg-panel-2); border: 2px dashed var(--line); color: var(--text-muted);
  font-size: var(--f-small); border-radius: var(--radius); min-height: 12vh; padding: 8px;
}
:focus-visible { outline: 4px solid var(--accent); outline-offset: 3px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important; animation-iteration-count: 1 !important;
    transition-duration: .01ms !important;
  }
  .fc { transition: none; }
  .bg-deco { display: none; }
}


/* ===================== LỚP HỌC / BẢNG TƯƠNG TÁC ===================== */
/* Học sinh thao tác bằng ngón tay hoặc bút trên bảng, đứng sát màn hình, tay che tầm nhìn.
   Mọi thứ học sinh phải chạm đều cần sàn kích thước — 44px chuẩn web là quá nhỏ ở đây. */
:root {
  --touch: clamp(64px, 9vh, 96px);        /* sàn vùng chạm cho học sinh */
  --touch-sm: clamp(52px, 7vh, 72px);     /* sàn cho item nhỏ trong lưới dày */
}
.btn { min-height: var(--touch); min-width: var(--touch); }
.drag-item, .dd-item, .chip, .cell, .fc, .zone, .dd-zone, .bin { min-height: var(--touch-sm); }
.imgrid > .cell { min-height: var(--touch); }
/* Navbar là tay giáo viên, không phải tay học sinh -> giữ nhỏ gọn, không ăn chỗ của nội dung. */

/* Gợn sóng tại điểm chạm: xác nhận tức thì cú chạm đã ăn, trước cả khi logic slide chạy xong. */
.ripple {
  position: fixed; z-index: var(--z-toast); pointer-events: none;
  width: 12px; height: 12px; margin: -6px 0 0 -6px; border-radius: 999px;
  background: var(--accent); opacity: .45;
  animation: rippleOut .5s var(--ease) forwards;
}
@keyframes rippleOut { to { transform: scale(11); opacity: 0; } }

/* Khoá giáo viên: học sinh lên bảng không bấm nhầm vào New Class / cỡ chữ / menu slide. */
body.tlock .teacher-only { display: none !important; }
body.tlock .navbar { background: var(--bg-panel-2); }
#tlockBtn.on { background: var(--ok); color: #fff; }

/* Đồng hồ đếm ngược — chiếu lên bảng cho cả lớp cùng nhìn, không phải widget góc màn hình. */
.cdown {
  position: fixed; top: calc(var(--navbar-h) + 12px); left: 50%; transform: translateX(-50%);
  z-index: var(--z-toast); pointer-events: none;
  display: none; align-items: center; gap: .4em;
  padding: .15em .7em; border-radius: 999px;
  background: var(--bg-panel); box-shadow: var(--shadow-lg);
  font-size: var(--f-h2); font-weight: 800; font-variant-numeric: tabular-nums;
  color: var(--text-primary); border: 4px solid var(--accent);
}
.cdown.on { display: flex; }
.cdown.warn { border-color: var(--bad); color: var(--bad); animation: pulse .9s ease-in-out infinite; }

/* Bảng điểm 2 đội — hoạt động cả lớp, thứ mọi tiết dạy trên bảng tương tác đều cần. */
.teams { display: flex; align-items: center; gap: 6px; font-size: var(--f-small); font-weight: 800; }
.teams .tm { display: flex; align-items: center; gap: 4px; padding: .1em .55em; border-radius: 999px; }
.teams .tm.a { background: var(--accent-soft); }
.teams .tm.b { background: var(--accent2-soft, #FFE9C7); }
.teams .tm button {
  border: none; background: rgba(0,0,0,.08); border-radius: 999px; cursor: pointer;
  width: 1.6em; height: 1.6em; font: inherit; line-height: 1; color: inherit;
}
.teams .tm button:active { transform: scale(.85); }

/* Đèn rọi: che mờ toàn màn hình trừ vùng quanh con trỏ/điểm chạm — dùng khi giảng để
   dồn chú ý vào đúng một chi tiết trên ảnh mà không phải cắt ảnh ra slide riêng. */
.spot {
  position: fixed; inset: 0; z-index: var(--z-lightbox, 60); pointer-events: none; display: none;
  background: rgba(20,16,12,.72);
  -webkit-mask: radial-gradient(circle var(--spot-r, 16vh) at var(--spot-x, 50%) var(--spot-y, 50%), transparent 98%, #000 100%);
          mask: radial-gradient(circle var(--spot-r, 16vh) at var(--spot-x, 50%) var(--spot-y, 50%), transparent 98%, #000 100%);
}
.spot.on { display: block; }

@media (prefers-reduced-motion: reduce) {
  .ripple { animation-duration: .01ms; }
  .cdown.warn { animation: none; }
}

/* theme.css */
:root {
  /* Giao diện: tông sâu, trầm, chuyên nghiệp. ĐỔI 3 biến này theo bài. */
  --accent: #9F1239;          /* maroon-rose 800 như chữ tiêu đề PPT — trắng trên nền này 7.6:1 */
  --accent-2: #0EA5E9;        /* sky 500 (xanh mây của PPT) — chỉ progress/thưởng */
  --accent2: #0EA5E9;
  --bg-base: #FFF7F8;
  --ok: #15803D;              /* base.css để #16A34A, trắng chỉ 3.3:1 -> nâng lên 5.0:1 */
}

/* 1. LƯỚI AN TOÀN CHỐNG VỠ LAYOUT — fitStage() hạ --fit khi nội dung thật tràn */
.slide {
  --fit: 1;
  --f-h1: calc(clamp(38px, 6.5vh, 130px) * var(--fs-scale) * var(--fit));
  --f-h2: calc(clamp(34px, 5.4vh, 108px) * var(--fs-scale) * var(--fit));
  --f-body: calc(clamp(32px, 4.2vh, 82px) * var(--fs-scale) * var(--fit));
  --f-btn: calc(clamp(26px, 3.7vh, 74px) * var(--fs-scale) * var(--fit));
  /* 3.0vh của base.css ở font-scale 80% ra 25.9px < 1/40 màn 1080p -> nâng 3.6vh */
  --f-small: calc(clamp(24px, 3.6vh, 64px) * var(--fs-scale) * var(--fit));
}

/* 2. TẦNG NỀN — nằm NGOÀI .slide nên không bao giờ chạm vào flex-flow nội dung */
#bgLayer { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
#app { position: relative; z-index: 1; }
#bgLayer .scene { position: absolute; inset: 0; opacity: 0; transition: opacity .6s ease; }
#bgLayer .scene.on { opacity: 1; }
#bgLayer .deco { position: absolute; opacity: 1; }
#bgLayer .blob { border-radius: 50%; }
#bgLayer .deco.drift { animation: bgDrift 28s ease-in-out infinite alternate; }
#bgLayer .deco.drift2 { animation: bgDrift2 34s ease-in-out infinite alternate; }
@keyframes bgDrift { from { transform: translate3d(0,0,0); } to { transform: translate3d(2.2vw,-2.4vh,0); } }
@keyframes bgDrift2 { from { transform: translate3d(0,0,0); } to { transform: translate3d(-2vw,2vh,0); } }

body.focus #bgLayer .deco { display: none; }
body.focus #bgLayer .scene { background-image: none !important; }
body.nomotion #bgLayer .deco { animation: none !important; }
body.nomotion .stagger > * { animation: none !important; opacity: 1 !important; transform: none !important; }
body.nomotion .float-anim, body.nomotion .pulse { animation: none !important; }
body.nomotion .slide.dir-next, body.nomotion .slide.dir-prev { animation: fadeIn .18s both; }

@media (prefers-reduced-motion: reduce) {
  #bgLayer .deco { animation: none !important; }
  /* LỖI base.css: rút animation-duration nhưng KHÔNG xoá animation-delay -> con thứ
     5-8 của .stagger còn ẩn (opacity:0 do fill-mode both) tới ~0.5s. */
  .stagger > * { animation-delay: 0s !important; }
}

/* 3. LỖI base.css: .bin khai min-height clamp(120px,22vh,240px) ở dòng ~265 nhưng dòng ~430
   (.drag-item,...,.bin{min-height:var(--touch-sm)}) cùng specificity nằm SAU nên đè mất ->
   mọi ô thả chỉ còn ~72px, nhìn như một vạch kẻ. theme.css nạp sau nên trả lại được. */
.bin { min-height: clamp(120px, 22vh, 240px); }

/* 4. KHUNG NỘI DUNG HIỆN ĐẠI — viền tóc + bóng 2 lớp + bo góc lớn */
:root {
  --radius: 20px;
  --radius-lg: 30px;
  --line: rgba(18, 36, 52, .10);
  --shadow: 0 2px 6px rgba(18,36,52,.05), 0 10px 26px rgba(18,36,52,.09);
  --shadow-lg: 0 4px 14px rgba(18,36,52,.07), 0 24px 56px rgba(18,36,52,.14);
}
.card, .qtext, .imgrid > .cell, .dd-zone, .bin { border-width: 1.5px; }
.card, .qtext, .imgrid > .cell { background: rgba(255,255,255,.94); }
.opt, .key { border-width: 2px; background: rgba(255,255,255,.96); }
.chip, .badge { border-width: 1.5px; background: rgba(255,255,255,.88); }
.navbar { border-bottom: 1.5px solid var(--line); }
.progress { height: 5px; }
.pill {
  background: linear-gradient(135deg, var(--accent) 0%, color-mix(in srgb, var(--accent) 74%, #0B2A36) 100%);
  padding: .3em 1.1em;
  letter-spacing: -.005em;
  box-shadow: 0 8px 22px color-mix(in srgb, var(--accent) 26%, transparent);
}
.btn-primary { box-shadow: 0 8px 20px color-mix(in srgb, var(--accent) 26%, transparent); }
.btn-check { box-shadow: 0 8px 20px color-mix(in srgb, var(--ok) 26%, transparent); }
/* base.css để Reset = accent; nếu accent cũng xanh lá thì Reset và Check gần như cùng màu,
   học sinh bấm nhầm trước cả lớp. */
.btn-reset { background: #475569; color: #fff; }
.btn-reset:active { background: #334155; }

/* 5. VI TƯƠNG TÁC — chỉ transform + opacity (ngân sách TV box) */
.pop-in { animation: popIn .34s var(--ease) both; }
@keyframes popIn { from { opacity: 0; transform: scale(.86); } to { opacity: 1; transform: none; } }
.nudge { animation: nudge .26s var(--ease); }
@keyframes nudge { 50% { transform: scale(1.08); } }

/* 6. KHỐI BỐ CỤC DÙNG LẠI */
.rowwrap { display: flex; gap: clamp(8px,1.6vh,18px); align-items: stretch; justify-content: center; min-height: 0; flex: 1 1 auto; }
.colhalf { flex: 1 1 0; min-width: 0; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: clamp(4px,1vh,12px); }
.note { font-size: var(--f-small); color: var(--text-muted); text-align: center; }
video.vid { width: 100%; height: 100%; max-height: 100%; object-fit: contain; border-radius: var(--radius); background: #000; }

/* Hình vẽ SVG co giãn (nhiệt kế, trục số, sơ đồ...) */
.viz { flex: 1 1 34vh; min-height: 0; display: flex; align-items: center; justify-content: center; width: 100%; }
.viz > svg { width: 100%; height: 100%; max-height: 100%; display: block; }
/* Cột chất lỏng/thanh chạy: scaleY từ đáy CHÍNH NÓ (fill-box), không phải view-box */
.liquid { transition: transform .9s cubic-bezier(.4,0,.2,1); transform-box: fill-box; transform-origin: 50% 100%; }
body.nomotion .liquid { transition: none; }

/* Ô thả có ảnh (ghép tên vào tranh) */
.dd-zone.matcell {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: clamp(2px,.6vh,8px); min-height: 0; overflow: hidden; padding: clamp(4px,.8vh,12px);
}
.colhalf > .matcell { flex: 1 1 auto; width: 100%; }
.dd-zone.matcell img { flex: 1 1 auto; align-self: stretch; width: 100%; height: 100%; min-height: 0; max-height: 100%; object-fit: contain; }
.dd-zone.matcell .drag-item { flex: 0 0 auto; font-size: var(--f-small); }

/* Điền từ nhiều dòng — luật cứng §12 */
.clozelist { display: flex; flex-direction: column; gap: clamp(6px,1.4vh,16px); flex: 1 1 auto; min-height: 0; justify-content: center; width: 100%; }
.clozerow { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: clamp(6px,1.2vw,18px); }
.clozerow .t { font-size: var(--f-body); }
.clozerow .t.l { text-align: right; }
.clozerow .t.r { text-align: left; }
.dd-zone.clozeslot { min-width: 7em; display: flex; align-items: center; justify-content: center; padding: clamp(4px,.8vh,10px) clamp(6px,1vw,14px); }

/* Lưới lựa chọn lớn (quiz) — bọc trong .grow.center-col để căn giữa vùng trống */
.optgrid { display: grid; gap: clamp(8px,1.6vh,18px); align-content: center; grid-auto-rows: minmax(clamp(72px,11vh,170px), auto); }
.opt { font: inherit; font-size: var(--f-btn); font-weight: 700; cursor: pointer; padding: .55em .8em; border-radius: var(--radius-lg); color: var(--text-primary); border: 2px solid var(--line); box-shadow: var(--shadow); transition: transform .14s var(--ease), border-color .15s, background .15s; }
.opt.picked { border-width: 3px; border-color: var(--accent); background: var(--accent-soft); transform: translateY(-3px); }
.opt:active { transform: scale(.97); }

/* 7. MÀN HÌNH DỌC / HẸP */
@media (max-aspect-ratio: 1/1) {
  .rowwrap { flex-wrap: wrap; }
  .rowwrap > .colhalf { flex: 1 1 42%; }            /* hàng >= 3 mục: 2 mục mỗi hàng */
  .rowwrap.stacked > .colhalf { flex: 1 1 100%; }   /* hàng 2 mục có đoạn văn dài: xếp dọc */
  .rowwrap.stacked { gap: clamp(4px,1vh,12px); }
  .rowwrap.stacked .card { padding: clamp(8px,1.2vh,14px); }
  .bin { min-height: clamp(80px,12vh,170px); }
  .hero-img { flex: 1 1 22vh; }
  .viz { flex: 1 1 17vh; }
  /* Hàng flex xuống dòng thì mỗi dòng cao theo NỘI DUNG; ảnh không có chiều cao xác
     định sẽ nở về kích thước gốc (ảnh dọc 768x1024 -> hơn 500px). Chặn trần. */
  .matcell img, .colhalf .fitimg { max-height: 26vh; }
  /* Hàng "mỗi mục 1 ảnh + vài lựa chọn": màn dọc thì mỗi mục thành 1 dải NGANG */
  .rowwrap.cases > .colhalf { flex: 1 1 100%; flex-direction: row; align-items: center; gap: clamp(8px,2vw,20px); }
  .rowwrap.cases > .colhalf > * { flex: 1 1 0; min-width: 0; }
  .rowwrap.cases .matcell img { max-height: 15vh; }
  .clozerow { grid-template-columns: 1fr auto; }
  .clozerow .t.r { grid-column: 2; text-align: left; }
}

/* 8. LỚP THẨM MỸ — font nhúng, thanh công cụ gọn, tiêu đề, thẻ kéo, ô chờ, bố cục mẫu */

/* 8a. FONT NHÚNG (assets/fonts, tải ở bước 3b) — mất mạng vẫn đúng font.
   Baloo 2 cho tiêu đề (tròn, thân thiện), Nunito cho nội dung (dễ đọc từ xa). */
@font-face { font-family: 'Baloo 2'; font-weight: 700; font-display: swap; src: url('assets/fonts/baloo-2-latin-700-normal.woff2') format('woff2'); }
@font-face { font-family: 'Baloo 2'; font-weight: 800; font-display: swap; src: url('assets/fonts/baloo-2-latin-800-normal.woff2') format('woff2'); }
@font-face { font-family: 'Nunito'; font-weight: 600; font-display: swap; src: url('assets/fonts/nunito-latin-600-normal.woff2') format('woff2'); }
@font-face { font-family: 'Nunito'; font-weight: 700; font-display: swap; src: url('assets/fonts/nunito-latin-700-normal.woff2') format('woff2'); }
@font-face { font-family: 'Nunito'; font-weight: 800; font-display: swap; src: url('assets/fonts/nunito-latin-800-normal.woff2') format('woff2'); }
:root { --font-display: 'Baloo 2', 'Nunito', system-ui, sans-serif; --font-body: 'Nunito', 'Baloo 2', system-ui, -apple-system, 'Segoe UI', sans-serif; }
body { font-family: var(--font-body); font-weight: 600; }
.pill, .hero-title, .lesson-title, .eyebrow, .btn, .opt, .drag-item, .intro, h1, h2, h3 { font-family: var(--font-display); }
/* Baloo 2 có vertical metrics rất cao (line-height normal ~1.6): KHÔNG chặn lại thì mọi nút/tiêu đề
   cao thêm ~30%, slide chật bị tràn. Chặn line-height ngay khi đổi font. */
.slide { line-height: 1.25; }
.pill, .hero-title, .btn, .opt, .drag-item, .eyebrow, .h1, .h2, .h3, h1, h2, h3 { line-height: 1.12; }

/* 8b. THANH CÔNG CỤ GỌN — chỉ còn: logo · tên bài · sao · ⚙ Teacher · toàn màn hình · ◀ ▶.
   Mọi công cụ giáo viên dời vào ngăn kéo #tdrawer (visual-system.js mục 5 lo). */
.navbar { gap: clamp(6px, .8vw, 12px); }
.navbar .lesson-title { font-weight: 800; color: var(--text-primary); font-size: var(--f-small); }
.navbar .iconbtn { background: transparent; }
.navbar .iconbtn.nav-arrow { background: var(--accent); color: #fff; width: calc(var(--navbar-h) * .78); height: calc(var(--navbar-h) * .78); }
.navbar .iconbtn.nav-arrow:active { background: color-mix(in srgb, var(--accent) 80%, #000); }
.navbar .iconbtn.tbtn { width: auto; padding: 0 .8em; gap: .35em; background: var(--accent-soft); font-weight: 800; font-family: var(--font-display); }
.navbar .stars { white-space: nowrap; flex: 0 0 auto; background: color-mix(in srgb, var(--accent-2) 16%, white); padding: .1em .7em; border-radius: 999px; }
.iconbtn .ic { width: 58%; height: 58%; }
.navbar .tbtn .ic { width: 1.1em; height: 1.1em; }
#tdrawer {
  position: fixed; z-index: var(--z-modal, 900); top: calc(var(--navbar-h) + 8px); right: 12px;
  display: none; flex-direction: column; gap: 10px; padding: 14px;
  background: #fff; border: 1.5px solid var(--line); border-radius: 22px; box-shadow: var(--shadow-lg);
  max-height: calc(100vh - var(--navbar-h) - 24px); overflow: auto;
}
#tdrawer.on { display: flex; animation: popIn .2s var(--ease) both; }
#tdrawer .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
#tdrawer .lbl { font-size: var(--f-small); color: var(--text-muted); font-weight: 700; min-width: 5.5em; }
#tdrawer .iconbtn { background: var(--accent-soft); }

/* 8c. TIÊU ĐỀ SLIDE — nhãn phần (eyebrow) + tiêu đề co theo chữ, không còn thanh xanh kéo hết bề ngang */
.pill {
  align-self: center; max-width: 100%;
  border-radius: 999px; padding: .18em 1.1em .22em;
  font-weight: 800; letter-spacing: -.01em;
}
.eyebrow {
  align-self: center; display: inline-flex; align-items: center; gap: .4em;
  font-size: var(--f-small); font-weight: 800; letter-spacing: .06em; text-transform: uppercase;
  color: color-mix(in srgb, var(--accent) 88%, #000); margin-bottom: -.2em;
}
.eyebrow::before, .eyebrow::after { content: ''; width: 1.6em; height: 3px; border-radius: 3px; background: var(--accent-2); }

/* 8d. THẺ KÉO — nhìn là biết cầm lên được: nền màu, chữ đậm, bóng, tay nắm ⠿ */
.drag-item {
  display: inline-flex; align-items: center; justify-content: center; gap: .35em;
  padding: .28em .8em .28em .55em; border-radius: 16px;
  font-size: var(--f-body); font-weight: 800; line-height: 1.15;
  background: #fff; color: var(--text-primary);
  border: 2.5px solid var(--chip-c, var(--accent));
  box-shadow: 0 4px 0 var(--chip-c, var(--accent)), 0 8px 18px rgba(18,36,52,.12);
  transition: transform .14s var(--ease), box-shadow .14s var(--ease);
}
.drag-item::before {
  content: ''; flex: 0 0 auto; width: .42em; height: .9em; opacity: .55;
  background: radial-gradient(circle, var(--chip-c, var(--accent)) 1.6px, transparent 2.2px) 0 0 / .21em .3em;
}
.drag-item:active, .drag-item.dragging { transform: translateY(2px) scale(1.04); box-shadow: 0 2px 0 var(--chip-c, var(--accent)), var(--shadow-lg); }
.drag-item.locked::before { display: none; }
.dd-tray > .drag-item:nth-child(4n+1) { --chip-c: #0EA5E9; }
.dd-tray > .drag-item:nth-child(4n+2) { --chip-c: #F97316; }
.dd-tray > .drag-item:nth-child(4n+3) { --chip-c: #8B5CF6; }
.dd-tray > .drag-item:nth-child(4n+4) { --chip-c: #10B981; }
.dd-tray { padding: clamp(6px, 1vh, 12px) clamp(8px, 1vw, 16px); border-radius: 22px; background: color-mix(in srgb, var(--accent) 6%, transparent); }
/* Thẻ đã nằm trong ô thì phẳng lại, nhường chỗ cho nội dung ô */
.dd-zone .drag-item { box-shadow: 0 2px 0 var(--chip-c, var(--accent)); font-size: var(--f-btn); }

/* 8e. Ô CHỜ THẢ — không bao giờ là một hộp trắng trơn */
.dd-zone, .bin {
  border: 3px dashed color-mix(in srgb, var(--accent) 45%, transparent) !important;
  background: repeating-linear-gradient(135deg, color-mix(in srgb, var(--accent) 5%, #fff) 0 14px, #fff 14px 28px) !important;
  border-radius: 22px;
}
.dd-zone:has(.drag-item), .bin:has(.drag-item) { border-style: solid !important; background: #fff !important; }
.dd-zone:empty::after, .bin:empty::after {
  content: 'Drop here'; margin: auto; font-family: var(--font-display); font-weight: 700;
  font-size: var(--f-small); color: color-mix(in srgb, var(--accent) 55%, #fff);
}
/* Nhãn đầu ô (vd "It's a …") thành chip màu, không phải chữ trôi nổi */
.bin > .bin-label, .bin > .chip:first-child, .bin > .t:first-child {
  flex: 0 0 100%; text-align: center; font-family: var(--font-display); font-weight: 800; font-size: var(--f-body); color: var(--accent);
}

/* 8f. NÚT — icon nét thay emoji đầu nhãn nút (visual-system.js mục 5 tự thay) */
.btn { font-weight: 800; letter-spacing: -.005em; }
.ic { display: inline-block; flex: 0 0 auto; width: 1.05em; height: 1.05em; background: currentColor;
  -webkit-mask: no-repeat center / contain; mask: no-repeat center / contain; }
.btn .ic { margin-right: .35em; }

/* 8g. BỐ CỤC MẪU — mỗi slide chọn 1, không quá 2 slide liền nhau cùng bố cục */
/* L1 COVER / SECTION: ảnh lớn một bên, tiêu đề cực to một bên, màu khối nền */
.cover { flex: 1 1 auto; min-height: 0; display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: clamp(12px, 3vw, 48px); align-items: center; }
.cover .cover-media { position: relative; height: 100%; min-height: 0; display: flex; align-items: center; justify-content: center; }
.cover .cover-media::before {
  content: ''; position: absolute; inset: 6% 4%; border-radius: 42% 58% 55% 45% / 50% 44% 56% 50%;
  background: linear-gradient(145deg, color-mix(in srgb, var(--accent) 22%, #fff), color-mix(in srgb, var(--accent-2) 26%, #fff));
}
/* Ảnh PPT thường nền trắng: KHÔNG dùng mix-blend-mode (slide đang animate transform nên bị cô lập, nền trắng vẫn lộ).
   Đặt ảnh thành thẻ ảnh có chủ đích, xoay nhẹ, khối màu ló ra phía sau. */
.cover .cover-media > * { position: relative; background: #fff; border-radius: 32px; padding: clamp(8px, 1.6vh, 20px); box-shadow: var(--shadow-lg); max-width: 76%; max-height: 82%; rotate: -2deg; }
.cover .cover-text { display: flex; flex-direction: column; gap: clamp(8px, 2vh, 22px); align-items: flex-start; }
.hero-title { font-size: calc(var(--f-h1) * 1.35); font-weight: 800; line-height: 1.02; letter-spacing: -.02em; color: var(--text-primary); }
.hero-title em { font-style: normal; color: var(--accent); }
.hero-sub { font-size: var(--f-body); color: var(--text-muted); font-weight: 700; }
.tagrow { display: flex; flex-wrap: wrap; gap: 8px; }
.tag { font-size: var(--f-small); font-weight: 800; padding: .15em .8em; border-radius: 999px; background: color-mix(in srgb, var(--accent) 12%, #fff); color: color-mix(in srgb, var(--accent) 85%, #000); }
/* L2 SPLIT: media 55% | nội dung 45% — dùng cho slide có 1 ảnh chính + câu hỏi/checklist */
.split { flex: 1 1 auto; min-height: 0; display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: clamp(10px, 2vw, 32px); align-items: stretch; }
.split > * { min-height: 0; display: flex; flex-direction: column; justify-content: center; gap: clamp(6px, 1.4vh, 16px); }
.split .media { background: #fff; border-radius: 28px; box-shadow: var(--shadow); padding: clamp(8px, 1.4vh, 16px); align-items: center; }
/* L3 STAGE CARD: 1 thẻ lớn giữa màn (flashcard, câu hỏi đơn) */
.stagecard { align-self: center; width: min(100%, 1200px); background: #fff; border-radius: 32px; box-shadow: var(--shadow-lg); padding: clamp(12px, 2.4vh, 30px); display: flex; flex-direction: column; align-items: center; gap: clamp(8px, 1.6vh, 18px); }
/* Thẻ ảnh trong lưới: ảnh trên nền màu nhạt, nhãn thành thanh chân thẻ */
.imgrid > .cell { background: #fff; border-radius: 24px; overflow: hidden; }
.imgrid > .cell > .chip:last-child { border: 0; border-radius: 0; background: color-mix(in srgb, var(--accent) 9%, #fff); font-weight: 800; align-self: stretch; }

/* 8h. VÙNG LÀM VIỆC TRỐNG (canvas vẽ, bảng viết) — luôn có nền gợi ý */
.workarea { background:
  radial-gradient(circle, color-mix(in srgb, var(--accent) 22%, transparent) 1.4px, transparent 1.8px) 0 0 / 28px 28px, #fff;
  border-radius: 28px; border: 2px solid var(--line); box-shadow: inset 0 2px 10px rgba(18,36,52,.05); }

@media (max-aspect-ratio: 1/1) {
  .cover, .split { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) auto; }
  .hero-title { font-size: var(--f-h1); }
}

/* 9. RIÊNG BÀI NÀY — hình minh hoạ nền của PPT gốc + trò chơi đua + thành phần riêng */

/* 9a. CẢNH NỀN (visual-system.js mục 6). Màu nền/khung chỉ ở rìa, vùng nội dung luôn là giấy trắng. */
#bgLayer .scene.sc-cover { background: linear-gradient(160deg, #FFF8F9 0%, #FCE9EE 100%); }
#bgLayer .wave1, #bgLayer .wave2 { background: url('assets/img/image2.png') center / contain no-repeat; }
#bgLayer .wave1 { right: -3vw; bottom: 3vh; width: 34vw; height: 15vw; opacity: .85; }
#bgLayer .wave2 { left: -6vw; top: calc(var(--navbar-h) + 2vh); width: 24vw; height: 10vw; opacity: .35; transform: scaleX(-1); }
#bgLayer .scene.sc-sky { background: linear-gradient(180deg, rgba(255,255,255,.18), rgba(255,255,255,0) 45%), url('assets/img/image14.png') center / cover no-repeat; }
#bgLayer .scene.sc-cloud { background: linear-gradient(180deg, #EAF7FC 0%, #D2EDF7 100%); }
#bgLayer .cloudstrip { left: 0; right: 0; bottom: 0; height: 24vh; background: url('assets/img/image49.png') bottom center / auto 100% repeat-x; }
#bgLayer .scene.sc-blue { background: #1565C0; }
#bgLayer .scene.sc-maroon { background: #6E1A2B; }
#bgLayer .scene.sc-crimson { background: linear-gradient(135deg, #A3192F 0%, #7A1426 100%); }
#bgLayer .scene.sc-gingham { background: radial-gradient(ellipse 60% 55% at 50% 52%, rgba(255,255,255,.55), rgba(255,255,255,0) 80%), url('assets/img/image83.png') center / cover no-repeat; }
#bgLayer .panel { position: absolute; top: calc(var(--navbar-h) + 1.2vh); left: 1.2vw; right: 1.2vw; bottom: 1.6vh; }
#bgLayer .sc-blue .panel { background: #fff; border-radius: 3.2vh; }
#bgLayer .sc-maroon .panel { background: url('assets/img/image79.png') center / 100% 100% no-repeat; }
#bgLayer .gift { right: 1vw; bottom: 0; width: 22vh; height: 36vh; background: url('assets/img/image8.png') bottom center / contain no-repeat; }
body[data-scene="blue"] .stage > .slide { padding: 2.6vh 2.8vw 3vh; }
body[data-scene="maroon"] .stage > .slide { padding: 5.2vh 5vw 6vh; }
body.focus #bgLayer .scene { background: #F8FAFC !important; }
body.focus #bgLayer .panel { display: none; }
.navbar { background: rgba(255,255,255,.97); position: relative; z-index: var(--z-navbar); }
.eyebrow { background: rgba(255,255,255,.92); padding: .02em .7em; border-radius: 999px; }
@media (max-aspect-ratio: 1/1) {
  body[data-scene="blue"] .stage > .slide, body[data-scene="maroon"] .stage > .slide { padding: 3vh 4vw 3.4vh; }
  #bgLayer .sc-maroon .panel { background: #fff; border-radius: 3vh; }
}

/* 9b. SLIDE BÌA & CHUYỂN PHẦN */
.cover .cover-media.bare > * { background: transparent; box-shadow: none; padding: 0; rotate: 0deg; max-width: 92%; max-height: 96%; }
.cover .cover-media.bare::before { inset: 10% 6%; }
.torn { align-self: stretch; background: url('assets/img/image5.png') center / 100% 100% no-repeat; padding: 5vh 4vw 6vh; display: flex; flex-direction: column; gap: 1.6vh; align-items: flex-start; }
.torn .hero-title { color: #9F1239; }
.sc-crimson-text .tag { background: #fff; }
.on-dark { color: #fff; }
.quote { font-size: var(--f-body); font-style: italic; color: var(--text-primary); font-weight: 700; }

/* 9c. BẢNG TRÒ CHƠI ĐUA */
.race { flex: 1 1 auto; min-height: 0; display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1.15fr) minmax(0,1fr); gap: clamp(8px, 1.6vw, 28px); align-items: stretch; }
.team { min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: clamp(4px, 1.2vh, 14px);
  background: rgba(255,255,255,.9); border-radius: 28px; box-shadow: var(--shadow-lg); padding: clamp(6px, 1.4vh, 16px) clamp(8px, 1vw, 16px); }
.team .who { display: flex; align-items: center; gap: .3em; font-family: var(--font-display); font-weight: 800; font-size: var(--f-body); line-height: 1.1; }
.team .who img { height: clamp(48px, 10vh, 130px); width: auto; flex: 0 0 auto; }
.team .who .stepc { font-size: var(--f-small); color: var(--text-muted); display: block; }
.team.r .who { color: #BE185D; } .team.t .who { color: #15803D; }
.team .nums { flex: 1 1 auto; min-height: 0; width: 100%; display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); grid-auto-rows: minmax(0,1fr); gap: clamp(6px, 1.4vh, 16px) clamp(6px, .8vw, 14px); }
.numbtn { position: relative; appearance: none; border: 0; background: transparent; padding: 0; cursor: pointer; min-height: var(--touch); display: flex; align-items: center; justify-content: center; border-radius: 22px; transition: transform .14s var(--ease); }
.numbtn:active { transform: scale(.92); }
.numbtn img { width: 100%; height: 100%; max-height: 15vh; object-fit: contain; pointer-events: none; }
.numbtn.used img { opacity: .38; }
.numbtn.is-ok, .numbtn.is-bad { background: transparent !important; }
.track { min-height: 0; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: repeat(7, minmax(0,1fr)); gap: .2vh .6vw; }
.track .goal { grid-column: 1 / span 2; position: relative; display: flex; justify-content: center; min-height: 0; }
.track .isl { position: relative; display: flex; align-items: center; justify-content: center; min-height: 0; }
.track .isl.zl { justify-content: flex-start; } .track .isl.zr { justify-content: flex-end; }
.track img.land { height: 100%; max-width: 100%; object-fit: contain; }
.track .goal img.land { height: 118%; margin-top: -6%; }
.runner { position: absolute; left: 50%; bottom: 40%; height: 135%; width: auto; transform: translateX(-50%); z-index: 2; pointer-events: none; }
.track .isl.zl .runner { left: 30%; } .track .isl.zr .runner { left: 70%; }
.track .goal .runner { bottom: 30%; height: 95%; }
.track .goal .runner.r { left: 38%; } .track .goal .runner.t { left: 62%; }
.track .start { font-family: var(--font-display); font-weight: 800; font-size: var(--f-small); color: #fff; text-shadow: 0 2px 6px rgba(0,0,0,.35); }
.winbanner { font-family: var(--font-display); font-weight: 800; font-size: var(--f-body); color: #fff; background: linear-gradient(135deg, #F59E0B, #D97706); border-radius: 999px; padding: .1em 1em; box-shadow: var(--shadow-lg); align-self: center; }

/* 9d. SLIDE CÂU HỎI */
.qhead { display: flex; align-items: center; justify-content: center; gap: clamp(8px, 1.4vw, 24px); }
.qbadge { display: flex; align-items: center; gap: .4vw; flex: 0 0 auto; }
.qbadge img { height: clamp(48px, 9vh, 120px); width: auto; flex: 0 0 auto; }
.qmedia { min-height: 0; background: #fff; border-radius: 28px; box-shadow: var(--shadow-lg); padding: clamp(6px, 1.2vh, 14px); display: flex; align-items: center; justify-content: center; overflow: hidden; }
.qcard { flex: 1 1 auto; min-height: 0; background: transparent; box-shadow: none; padding: 0; width: min(100%, 1300px); }
.qcard > .qmedia { flex: 1 1 40vh; width: 100%; }
.qmedia video.vid { border-radius: 20px; }
.split > .qmedia { padding: clamp(6px, 1.2vh, 14px); }
.cloudbox, .cloudopt { position: relative; isolation: isolate; font-family: var(--font-display); font-weight: 800; color: #1F2937; text-align: center; line-height: 1.1; }
.cloudbox::before, .cloudopt::before { content: ''; position: absolute; inset: 0; z-index: -1; background: url('assets/img/image50.png') center / 100% 100% no-repeat; }
.cloudbox { flex: 0 0 auto; font-size: var(--f-h1); min-width: 7em; padding: .45em 1.6em .6em; cursor: pointer; }
.qside { display: flex; flex-direction: column; justify-content: center; gap: clamp(8px, 2vh, 24px); }
.qopts { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: clamp(8px, 2.4vh, 30px) clamp(8px, 1vw, 18px); }
.cloudopt { appearance: none; border: 0; background: transparent; cursor: pointer; font-size: var(--f-h2); padding: .6em .7em .75em; min-height: clamp(84px, 15vh, 200px); transition: transform .14s var(--ease); }
.cloudopt:active { transform: scale(.95); }
.cloudopt.is-ok, .cloudopt.is-bad { background: transparent !important; }
.cloudopt.is-ok::before { background-image: url('assets/img/image54.png'); }
.cloudopt.is-bad { color: #9F1239; }
.cloudopt.is-bad::before { opacity: .45; }
.qside .qstatus, .qfoot .qstatus { font-size: var(--f-body); font-weight: 800; color: var(--accent); }
.btn-wrong { background: #B91C1C; color: #fff; }

/* 9e. LEAD-IN / CONSOLIDATION: lưới bộ phận cơ thể quanh hình em bé */
.organs { grid-template-columns: repeat(2, minmax(0,1fr)) minmax(0,1.15fr) repeat(2, minmax(0,1fr)); grid-template-rows: repeat(2, minmax(0,1fr)); }
.organs > .cell { cursor: pointer; }
.organs > .kid { grid-column: 3; grid-row: 1 / span 2; background: transparent; box-shadow: none; border: 0; justify-content: center; gap: 0; }
.organs > .kid img.head { flex: 0 1 30%; }
.organs > .kid img.body { flex: 1 1 70%; }
.organs .chip.hide { color: transparent; }
.organs .chip.hide::after { content: 'Tap me'; color: var(--text-muted); position: absolute; }
.organs > .cell > .chip { position: relative; }
.askq { font-size: var(--f-body); font-weight: 800; color: #1565C0; text-align: center; }
.answerbox { font-size: var(--f-body); font-weight: 800; color: #1565C0; text-align: center; background: #EFF6FF; border-radius: 22px; padding: .3em .8em; }

/* 9f. THẺ LẬT TỪ VỰNG */
.vfc { width: min(100%, 150vh) !important; height: 100% !important; }
.vfc .face { padding: clamp(10px, 2vh, 26px) clamp(14px, 2.6vw, 44px); }
.vfc .front { flex-direction: row; gap: clamp(14px, 3vw, 50px); }
.vfc .front > * { flex: 1 1 0; min-width: 0; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: clamp(6px, 1.2vh, 14px); }
.vfc .back { gap: clamp(10px, 2vh, 24px); background: linear-gradient(180deg, #EFF6FF 0%, #fff 60%); }
.vword { font-family: var(--font-display); font-weight: 800; font-size: calc(var(--f-h1) * 1.1); color: #fff; background: #16A34A; border-radius: 18px; padding: .05em .6em .1em; line-height: 1.1; text-align: center; }
.vpos { font-size: var(--f-body); color: var(--text-muted); }
.ipa { font-family: 'Charis SIL', 'Doulos SIL', 'Lucida Sans Unicode', 'Arial Unicode MS', 'Segoe UI', sans-serif; font-weight: 400; font-size: var(--f-body); color: #1F2937; }
.vdef { font-size: var(--f-body); font-weight: 700; text-align: center; }
.vvi { font-family: var(--font-display); font-size: var(--f-h2); font-weight: 800; color: #9F1239; text-align: center; }
.vhint { font-size: var(--f-small); color: var(--text-muted); }

/* 9g. GHÉP NGHĨA */
.vm > .cell { justify-content: space-between !important; }
.vm .vi { font-family: var(--font-display); font-weight: 800; font-size: var(--f-body); color: #9F1239; text-align: center; flex: 0 0 auto; }
.vm .dd-zone { width: 100%; min-height: var(--touch) !important; flex: 0 0 auto; display: flex; align-items: center; justify-content: center; padding: 6px; }

/* 9h. BÀI ĐỌC */
.reading { flex: 1 1 auto; min-height: 0; width: min(100%, 1600px); align-self: center; display: flex; flex-direction: column; justify-content: center; gap: clamp(8px, 1.8vh, 22px);
  background: #fff; border-radius: 28px; box-shadow: var(--shadow); padding: clamp(10px, 2vh, 26px) clamp(14px, 2.4vw, 40px); }
.reading p { margin: 0; font-size: var(--f-body); line-height: 1.4; text-indent: 1.4em; }
.sent { cursor: pointer; border-radius: .25em; transition: background .2s; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
.sent.on { background: #FDE68A; }
.sent.key { text-decoration: underline 3px #0EA5E9; text-underline-offset: .18em; }

/* 9i. ĐÚNG / SAI */
.tfcard { flex: 1 1 auto; min-height: 0; justify-content: center; border: 4px solid #BFDBFE; }
.tfletter { font-family: var(--font-display); font-weight: 800; font-size: var(--f-h2); color: #fff; background: #1D4ED8; width: 1.6em; height: 1.6em; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex: 0 0 auto; }
.tfstate { font-family: var(--font-display); font-size: var(--f-h1); font-weight: 800; color: #15803D; text-align: center; line-height: 1.15; }
.tfbtns { display: flex; gap: clamp(12px, 3vw, 60px); justify-content: center; }
.tfbtn { font-size: var(--f-h2); min-width: 5.5em; color: #fff; }
.tfbtn.t { background: #1E5AA8; } .tfbtn.f { background: #1E5AA8; }
.tfbtn.is-ok { color: #14532D; } .tfbtn.is-bad { color: #7F1D1D; }
.evidence { font-size: var(--f-small); color: #1F2937; background: #FEF9C3; border-radius: 16px; padding: .3em .8em; text-align: center; }
.tfdots { display: flex; gap: clamp(6px, 1vw, 14px); justify-content: center; }
.tfdot { appearance: none; border: 3px solid #1D4ED8; background: #fff; color: #1D4ED8; font: inherit; font-family: var(--font-display); font-weight: 800; font-size: var(--f-small);
  min-width: var(--touch-sm); min-height: var(--touch-sm); border-radius: 999px; cursor: pointer; }
.tfdot.now { background: #1D4ED8; color: #fff; }
.tfdot.ok { background: #DCFCE7; border-color: #15803D; color: #15803D; }
.tfdot.bad { background: #FEE2E2; border-color: #B91C1C; color: #B91C1C; }

/* 9j. NGHE & ĐIỀN */
.cgrid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: clamp(6px, 1.4vh, 16px) clamp(8px, 1vw, 16px); width: 100%; }
.crow { display: flex; align-items: center; gap: .35em; min-width: 0; }
.cnum { font-family: var(--font-display); font-weight: 800; font-size: var(--f-body); color: var(--accent); flex: 0 0 auto; }
.cslot.dd-zone { flex: 1 1 auto; min-height: var(--touch-sm); display: flex; align-items: center; justify-content: center; padding: 4px 6px; }
.cslot.dd-zone .drag-item, .oslot.dd-zone .drag-item { font-size: var(--f-small); padding: .15em .5em; }
.cslot.dd-zone:empty::after, .oslot.dd-zone:empty::after { content: attr(data-n); }
.audiorow { display: flex; gap: clamp(6px, 1vw, 14px); justify-content: center; flex-wrap: wrap; }
.split .dd-tray .drag-item { font-size: var(--f-small); }

/* 9k. SẮP XẾP CÂU */
.steps { display: flex; gap: clamp(6px, 1vw, 16px); justify-content: center; align-items: center; }
.stepbtn { appearance: none; font: inherit; font-family: var(--font-display); font-weight: 800; font-size: var(--f-btn); min-width: var(--touch); min-height: var(--touch-sm);
  border-radius: 999px; border: 3px solid var(--accent); background: #fff; color: var(--accent); cursor: pointer; padding: 0 .8em; }
.stepbtn.on { background: var(--accent); color: #fff; }
.stepbtn.ok { border-color: #15803D; color: #15803D; }
.ctx { font-size: var(--f-body); text-align: center; line-height: 1.3; background: #fff; border-radius: 22px; padding: .3em .8em; box-shadow: var(--shadow); }
.ctx .gap { color: var(--accent); font-weight: 800; }
.oslots { display: flex; flex-wrap: wrap; gap: clamp(6px, 1.2vh, 14px); justify-content: center; align-content: center; }
.oslot.dd-zone { min-width: 3.6em; min-height: var(--touch-sm); display: flex; align-items: center; justify-content: center; padding: 4px 6px; border-radius: 18px; }
.ostage { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; justify-content: center; gap: clamp(8px, 2vh, 22px); }
.ostage[hidden] { display: none; }

/* 9l. PHÂN LOẠI THÓI QUEN / THỰC PHẨM */
.bin { flex-direction: row; }
.bins-row .bin { flex: 1 1 0; }
.bin-label { display: flex; align-items: center; justify-content: center; gap: .3em; }

/* 9m. NÓI THEO CẶP */
.topic { font-family: var(--font-display); font-weight: 800; font-size: var(--f-h2); color: #9F1239; text-align: center; background: #FFF1F2; border-radius: 22px; padding: .3em .7em; min-height: 2.4em; display: flex; align-items: center; justify-content: center; }
.task { font-size: var(--f-body); font-weight: 800; color: #15803D; text-align: center; background: #FEF9C3; border-radius: 22px; padding: .3em .7em; }

/* 9n. GHI NHỚ */
.recall { flex: 1 1 auto; min-height: 0; display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: clamp(10px, 2vw, 32px); }
.rcard { display: flex; flex-direction: column; gap: clamp(8px, 1.6vh, 18px); cursor: pointer; justify-content: flex-start; border-top: 10px solid #9F1239; }
.rcard .hd { font-family: var(--font-display); font-weight: 800; font-size: var(--f-h2); color: #9F1239; display: flex; align-items: center; gap: .3em; }
.rcard ul { margin: 0; padding-left: 1.1em; display: flex; flex-direction: column; gap: .4em; }
.rcard li { font-size: var(--f-body); font-weight: 700; }
.rcard .tap { font-size: var(--f-small); color: var(--text-muted); }
.rcard:not(.open) ul { display: none; }
.rcard.open .tap { display: none; }
.rcard .rimg { flex: 1 1 auto; min-height: 0; }
.rcard.open .rimg { flex: 1 1 18vh; }
.rules { margin: 0; padding-left: 1.1em; display: flex; flex-direction: column; gap: .35em; }
.rules li { font-size: var(--f-body); font-weight: 700; line-height: 1.25; }

/* 9o. SỬA SAU SOÁT ẢNH: căn giữa "an toàn" — nội dung dư không bị đẩy ngược lên đè tiêu đề
   (tràn xuống dưới thì fitStage đo được và tự co chữ). */
.split > *, .colhalf, .center-col, .rowwrap { justify-content: safe center; }
.reading { justify-content: safe center; }
.cover .cover-media.wide > * { height: auto; width: 96%; max-width: 96%; max-height: 90%; padding: clamp(6px, 1vh, 12px); }
.cover .cover-media.wide > .hero-img { flex: 0 1 auto; }
.qcard { width: min(100%, 118vh); }
.recall { grid-template-rows: minmax(0, 1fr); }
.rcard { min-height: 0; overflow: hidden; }
.rcard .rimg { flex: 1 1 0; min-height: 0; }
.rcard.open .rimg { flex: 1 1 0; }
.track .runner { height: 150%; }
.organs .chip { font-size: var(--f-small); line-height: 1.1; padding: .2em .5em; }
.organs .chip.tapme { color: var(--text-muted); }
.listen-side { gap: clamp(8px, 2vh, 22px); }
@media (max-aspect-ratio: 1/1) {
  .vm { grid-template-columns: repeat(2, minmax(0,1fr)) !important; }
  .vfc .front { flex-direction: column; }
  .vfc .vword { font-size: var(--f-h2); }
  .organs { grid-template-columns: repeat(2, minmax(0,1fr)) !important; grid-template-rows: none; grid-auto-rows: minmax(0,1fr); }
  .organs > .kid { display: none; }
  .race { grid-template-columns: minmax(0,1fr) minmax(0,1fr); grid-template-rows: auto minmax(0,1fr); }
  .race > .track { grid-column: 1 / span 2; grid-row: 2; }
  .team .nums { grid-template-columns: repeat(6, minmax(0,1fr)); }
  .team .who img { height: 7vh; }
  .recall { grid-template-columns: minmax(0,1fr); grid-template-rows: repeat(2, minmax(0,1fr)); }
  .qopts { grid-template-columns: repeat(2, minmax(0,1fr)); }
  .cgrid { grid-template-columns: repeat(2, minmax(0,1fr)); }
}
.organs > .cell:not(.kid) { position: relative; justify-content: flex-start; padding-bottom: clamp(4px, .8vh, 10px); }
.organs > .cell > .chip { position: absolute; left: 6px; right: 6px; bottom: 6px; background: rgba(255,255,255,.92) !important; }
.vm .vi { font-size: var(--f-small); }
.vm .dd-zone { min-height: var(--touch-sm) !important; }
.vm > .cell { padding: clamp(4px, .8vh, 10px) !important; gap: clamp(2px, .6vh, 8px); }
@media (max-aspect-ratio: 1/1) {
  .vfc .front > * { height: auto; flex: 1 1 0; min-height: 0; }
}
.organs > .cell > .chip { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
@media (max-aspect-ratio: 1/1) {
  .vm img { flex: 1 1 0; }
  .vm > .cell { justify-content: center !important; }
  .vfc .vhint, .vfc .zoomhint { display: none; }
  .vfc .front > :first-child { flex: 1 1 0; }
  .vfc .front > :last-child { flex: 0 0 auto; }
  .rcard .rimg { flex: 0 1 8vh; }
  .rcard.open .rimg { flex: 0 1 6vh; }
  .rcard .hd { font-size: var(--f-body); }
}
.vm .dd-zone { padding: 2px 4px !important; }
.vm .dd-zone .drag-item { font-size: var(--f-small); padding: .1em .5em; }
@media (max-aspect-ratio: 1/1) { .vfc .ipa, .vfc .vpos { font-size: var(--f-small); } .vfc .back .vword { font-size: var(--f-body); } }
/* Slide nhiều thẻ: cho khối split cao theo nội dung để fitStage đo được phần dư và tự co chữ */
.split.fitgrow { min-height: auto; }
.audiorow .btn { font-size: var(--f-small); padding: .35em .8em; }
.cslot.dd-zone { min-height: clamp(44px, 6vh, 64px); }
.cgrid { grid-template-columns: repeat(2, minmax(0,1fr)); }
.cgrid .crow { min-height: 0; }
.split.lsplit { min-height: auto; }
.split.lsplit .hero-img { flex: 1 1 0; }
.dd-tray.smallchips .drag-item { font-size: var(--f-small); padding: .18em .6em .18em .45em; }
.qhead > .btn { font-size: var(--f-small); padding: .3em .8em; min-height: var(--touch-sm); }
@media (max-aspect-ratio: 1/1) {
  .split.lsplit { grid-template-rows: minmax(16vh, 1fr) auto; }
  .split.lsplit .zoomhint { display: none; }
  .qhead { flex-wrap: wrap; }
}
.cover .cover-media.wide > .hero-img { align-self: center; }
/* Bài đọc dài: khối cao theo nội dung -> nếu dư, fitStage đo được và co chữ thay vì chữ đè lên nút */
.grow.fitgrow, .grow.fitgrow > .reading { min-height: auto; }
