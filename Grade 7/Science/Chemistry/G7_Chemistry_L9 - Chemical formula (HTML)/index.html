    init(files, prefer) {
      Object.assign(this._files, files || {});
      this._prefer = prefer || null;      // giọng mặc định khai trong config.json
      this._muted = !!Store.pref('mute');
      if (!hasTTS) return;
      const load = () => {
        try { this._voices = speechSynthesis.getVoices() || []; } catch (e) { this._voices = []; }
        if (this._voices.length) { this._pick(); return true; }
        return false;
      };
      try { speechSynthesis.onvoiceschanged = () => load(); } catch (e) {}
      let n = 0;
      const t = setInterval(() => { if (load() || ++n > 10) clearInterval(t); }, 250);
      load();
    },
    _pick() {
      const cached = Store.pref('voice');
      /* giáo viên đã tự chọn giọng -> tôn trọng tuyệt đối, kể cả giọng hiệu ứng */
      if (cached && Store.pref('voiceLocked')) {
        const manual = this._voices.find(v => v.name === cached);
        if (manual) { this._voice = manual; console.log('[sound] voice (thủ công) =', manual.name); return; }
      }
      const usable = this._voices.filter(v => /^en/i.test(v.lang) && !BLOCK.test(v.name));
      if (cached) { const hit = usable.find(v => v.name === cached); if (hit) { this._voice = hit; return; } }
      if (this._prefer) { const hit = this._voices.find(v => v.name === this._prefer); if (hit) { this._voice = hit; return; } }
      this._voice =
        usable.find(v => SIRI.some(p => v.name.startsWith(p))) ||
        usable.find(v => v.name === 'Samantha') ||
        usable.find(v => /en-US/i.test(v.lang)) ||
        usable[0] || null;
      if (this._voice) Store.pref('voice', this._voice.name);
      console.log('[sound] voice =', this._voice ? this._voice.name : '(system default)');
    },

    /* --- API chọn giọng thủ công --- */
    all() { return this._voices.slice(); },
    current() { return this._voice; },
    isFun(v) { return BLOCK.test(v.name); },     // giọng hiệu ứng vui của macOS/iOS
    setVoice(name) {
      if (name == null) {                        // về chế độ tự chọn
        Store.pref('voiceLocked', false);
        Store.pref('voice', null);
        this._pick();
        return this._voice;
      }
      const v = this._voices.find(x => x.name === name);
      if (!v) return null;
      this._voice = v;
      Store.pref('voice', name);
      Store.pref('voiceLocked', true);
      console.log('[sound] giáo viên chọn giọng:', name, v.lang);
      return v;
    },
    rateAdj(v) {
      if (v === undefined) { const r = Store.pref('rateAdj'); return r == null ? 1 : r; }
      Store.pref('rateAdj', Math.min(1.3, Math.max(0.6, Math.round(v * 20) / 20)));
      return this.rateAdj();
    },
    /* nghe thử 1 giọng cụ thể mà KHÔNG đổi giọng đang dùng */
    preview(name, text) {
      const v = this._voices.find(x => x.name === name);
      if (!v || !hasTTS) return Promise.resolve();
      try { if (speechSynthesis.speaking) speechSynthesis.cancel(); } catch (e) {}
      return new Promise(res => setTimeout(() => {
        const u = new SpeechSynthesisUtterance(text || 'Hello! This is my voice. Let us learn English together.');
        u.voice = v; u.lang = v.lang || 'en-US';
        u.rate = 0.92 * this.rateAdj(); u.pitch = 1.0;
        u.onend = u.onerror = () => { this._utter = null; res(); };
        this._utter = u;
        try { speechSynthesis.speak(u); } catch (e) { res(); }
      }, 30));
    },
    muted() { return this._muted; },
    setMuted(v) { this._muted = !!v; Store.pref('mute', this._muted); if (this._muted) this.stopAll(); },

    /* hiệu ứng: dừng bản cũ + debounce theo tên < 100ms */
    playEffect(name) {
      if (this._muted) return Promise.resolve();
      const now = Date.now();
      if (now - (this._last[name] || 0) < 100) return Promise.resolve();
      this._last[name] = now;
      const src = this._files[name];
      if (!src) return Promise.resolve();
      try { if (this._fx) { this._fx.pause(); this._fx.currentTime = 0; } } catch (e) {}
      const a = new Audio(src);          // luôn tạo mới, không tái dùng 1 thẻ <audio>
      a.volume = 0.6;                    // chừa headroom, tránh rè/clipping
      this._fx = a;
      return new Promise(res => {
        a.addEventListener('ended', res, { once: true });
        a.addEventListener('error', () => res(), { once: true });
        const p = a.play();
        if (p && p.catch) p.catch(e => { console.warn('[sound] effect blocked', e); res(); });
        setTimeout(res, 1500);
      });
    },

    /* làm sạch text trước TTS: bỏ placeholder, entity, khoảng trắng thừa */
    clean(t) {
      return String(t == null ? '' : t)
        .replace(/&nbsp;|&amp;|&#\d+;/g, ' ')
        .replace(/[_]{2,}/g, ' ')
        .replace(/\.{3,}/g, ' ')
        .replace(/\s+/g, ' ')
        .trim();
    },
    speak(text, opts) {
      opts = opts || {};
      if (this._muted || !hasTTS) return Promise.resolve();
      const t = this.clean(text);
      if (!t) return Promise.resolve();
      const words = t.split(' ').length;
      const rate = (opts.rate != null ? opts.rate : (words > 1 ? 0.92 : 0.78)) * this.rateAdj();
      const run = (retry) => new Promise(res => {
        const u = new SpeechSynthesisUtterance(t);
        /* giọng do giáo viên tự chọn -> theo lang của chính giọng đó */
        u.lang = (this._voice && Store.pref('voiceLocked') && this._voice.lang) ? this._voice.lang : 'en-US';
        if (this._voice) u.voice = this._voice;
        else if (!this._warned) { this._warned = true; Engine.toast('Using system default voice'); }
        u.rate = rate; u.pitch = 1.0;
        if (opts.onBoundary) u.onboundary = safe(opts.onBoundary, 'boundary');
        u.onend = () => { this._utter = null; res(); };
        u.onerror = (e) => {
          console.warn('[sound] utterance error', e && e.error);
          this._utter = null;
          if (!retry) setTimeout(() => run(true).then(res), 300); else res('error');
        };
        this._utter = u;                 // giữ ở scope ngoài, chống GC cắt câu
        try { speechSynthesis.speak(u); } catch (e) { res('error'); }
      });
      const go = () => run(false);
      if (speechSynthesis.speaking) {
        try { speechSynthesis.cancel(); } catch (e) {}
        return new Promise(r => setTimeout(() => go().then(r), 30));
      }
      return go();
    },
    /* sfx rồi mới đọc — không phát đồng thời */
    cue(name, text) { return this.playEffect(name).then(() => this.speak(text)); },
    repeat(text, n) {
      let p = Promise.resolve();
      for (let i = 0; i < (n || 3); i++) p = p.then(() => this.speak(text)).then(() => new Promise(r => setTimeout(r, 400)));
      return p;
    },
    stopAll() {
      try { if (hasTTS && speechSynthesis.speaking) speechSynthesis.cancel(); } catch (e) {}
      try { if (this._fx) { this._fx.pause(); this._fx.currentTime = 0; } } catch (e) {}
      document.querySelectorAll('audio,video').forEach(m => { try { m.pause(); } catch (e) {} });
    },
    supported() { return hasTTS; }
  };

  /* ---------- SlideCtx: mọi listener/timer đăng ký ở đây được tự dọn ---------- */
  function SlideCtx(root, def) {
    this.root = root; this.def = def;
    this._off = []; this._timers = []; this._ros = [];
  }
  SlideCtx.prototype = {
    on(target, ev, fn, opts) {
      const h = safe(fn, this.def.id + ':' + ev);
      target.addEventListener(ev, h, opts);
      this._off.push(() => target.removeEventListener(ev, h, opts));
      return h;
    },
    timeout(fn, ms) { const t = setTimeout(safe(fn), ms); this._timers.push(() => clearTimeout(t)); return t; },
    interval(fn, ms) { const t = setInterval(safe(fn), ms); this._timers.push(() => clearInterval(t)); return t; },
    observe(target, fn) {
      if ('ResizeObserver' in global) {
        const ro = new ResizeObserver(safe(fn));
        ro.observe(target); this._ros.push(() => ro.disconnect());
      } else {
        this.on(global, 'resize', fn);
        this.interval(fn, 800);
      }
    },
    cleanup() {
      this._off.forEach(f => { try { f(); } catch (e) {} });
      this._timers.forEach(f => { try { f(); } catch (e) {} });
      this._ros.forEach(f => { try { f(); } catch (e) {} });
      this._off = []; this._timers = []; this._ros = [];
    },

    /* --- helper dựng UI --- */
    sound: Sound,
    shuffle(arr) { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1));[a[i], a[j]] = [a[j], a[i]]; } return a; },

    /* ảnh tham khảo: luôn kèm lightbox + placeholder khi lỗi tải */
    img(src, o) {
      o = o || {};
      const im = el('img', { src: src, alt: o.alt || '', class: o.class || 'fitimg' });
      im.addEventListener('error', () => {
        const ph = el('div', { class: 'assetfail', text: o.alt || 'Image unavailable' });
        if (im.parentNode) im.parentNode.replaceChild(ph, im);
      });
      if (o.zoom !== false) {
        im.style.cursor = 'zoom-in';
        this.on(im, 'click', () => Engine.lightbox(src, o.alt));
      }
      return im;
    },
    zoomHint() { return el('div', { class: 'zoomhint', text: '🔍 Click to zoom in' }); },

    /* nút 🔊: tự disable trong lúc phát, chống bấm dồn */
    speakBtn(text, label) {
      if (!Sound.supported()) return document.createComment('no tts');
      const b = el('button', { class: 'btn', 'aria-label': 'Listen' }, ['🔊', label || '']);
      this.on(b, 'click', () => {
        b.disabled = true;
        Sound.speak(text).then(() => { b.disabled = false; });
      });
      return b;
    },

    /* bộ 3 nút cố định — LUÔN hiện đủ, không ẩn/hiện có điều kiện */
    buttons(h) {
      const row = el('div', { class: 'btnrow fixed' });
      const bC = el('button', { class: 'btn btn-check', text: '✅ Check' });
      const bS = el('button', { class: 'btn btn-show', text: '👁 Show answer' });
      const bR = el('button', { class: 'btn btn-reset', text: '↺ Reset' });
      this.on(bC, 'click', () => {
        const r = h.check ? h.check() : null;
        if (r && typeof r.correct === 'number') Engine.score(r.correct, r.total);
      });
      this.on(bS, 'click', () => h.show && h.show());
      this.on(bR, 'click', () => { Sound.stopAll(); h.reset && h.reset(); });
      row.append(bC, bS, bR);
      if (h.hint) {
        const bH = el('button', { class: 'btn', text: '💡 Hint (-1 ⭐)' });
        this.on(bH, 'click', () => { Engine.addStars(-1); h.hint(); });
        row.appendChild(bH);
      }
      return row;
    },

    /* hit-test theo % của chính ảnh; rect luôn đo lại lúc click */
    hotspots(src, spots, o) {
      o = o || {};
      const wrap = el('div', { class: 'hotwrap' });
      const im = this.img(src, { alt: o.alt, zoom: false });
      wrap.appendChild(im);
      let ready = false;
      const mark = (x, y, ok) => {
        const m = el('i', { class: 'hotmark' + (ok ? '' : ' bad'), style: `left:${x * 100}%;top:${y * 100}%` });
        wrap.appendChild(m); return m;
      };
      const armed = () => ready && !wrap.closest('.slide').className.match(/dir-(next|prev|jump)/);
      const onReady = () => { ready = true; };
      if (im.complete) onReady(); else this.on(im, 'load', onReady);
      this.observe(wrap, () => { });
      this.on(wrap, 'pointerup', (e) => {
        if (!armed()) return;
        const rect = im.getBoundingClientRect();       // đo lại mỗi lần click
        const x = (e.clientX - rect.left) / rect.width;
        const y = (e.clientY - rect.top) / rect.height;
        const tol = o.tolerance || 0.06;
        const hit = spots.find(s => Math.hypot(s.x - x, s.y - y) <= tol);
        o.onPick && o.onPick(hit || null, x, y, mark);
      });
      wrap.__mark = mark;
      wrap.__clear = () => wrap.querySelectorAll('.hotmark').forEach(n => n.remove());
      wrap.__showAnswers = () => spots.filter(s => s.correct !== false).forEach(s => mark(s.x, s.y, true));
      return wrap;
    },

    /* canvas vẽ: backing store theo devicePixelRatio, tính lại khi đổi kích thước */
    canvas(o) {
      o = o || {};
      const c = el('canvas', { class: 'draw' });
      const ctx = c.getContext('2d');
      const strokes = []; let cur = null;
      const fit = () => {
        const r = c.getBoundingClientRect();
        const dpr = global.devicePixelRatio || 1;
        c.width = Math.max(1, Math.round(r.width * dpr));
        c.height = Math.max(1, Math.round(r.height * dpr));
        ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.scale(dpr, dpr);
        redraw();
      };
      const redraw = () => {
        const r = c.getBoundingClientRect();
        ctx.clearRect(0, 0, r.width, r.height);
        strokes.forEach(s => {
          ctx.strokeStyle = s.color; ctx.lineWidth = s.w; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
          ctx.beginPath(); s.pts.forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y)); ctx.stroke();
        });
      };
      const pos = e => { const r = c.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };
      this.on(c, 'pointerdown', e => { c.setPointerCapture(e.pointerId); cur = { color: c.__color || '#E11D48', w: c.__w || 8, pts: [pos(e)] }; strokes.push(cur); });
      this.on(c, 'pointermove', e => { if (cur) { cur.pts.push(pos(e)); redraw(); } });
      this.on(c, 'pointerup', () => { cur = null; });
      this.on(c, 'pointercancel', () => { cur = null; });
      this.observe(c, fit);
      this.timeout(fit, 0);
      c.__undo = () => { strokes.pop(); redraw(); };
      c.__clear = () => { strokes.length = 0; redraw(); };
      c.__color = o.color || '#E11D48'; c.__w = o.width || 8;
      return c;
    },

    /* --------------------------------------------------------------
       KÉO-THẢ nền tảng — Pointer Events hợp nhất chuột/chạm/bút.
       KHÔNG dùng HTML5 draggable=true/dragstart/drop: API đó không ổn
       định trên iPad/Chromebook cảm ứng — nguồn lỗi phổ biến nhất khi
       mỗi bài tự viết lại. Dùng ctx.draggable()/ctx.dragDrop() thay vì
       tự viết pointerdown/pointermove tay.
       -------------------------------------------------------------- */

    /* biến 1 phần tử thành item kéo được — item LUÔN nằm giữa con trỏ/ngón tay khi kéo
       (snap thẳng vào giữa con trỏ ngay lúc nhấc lên, tính lại từ e.clientX/Y mỗi frame — không
       cộng dồn lệch từ điểm bấm ban đầu, tự sửa sai mỗi lần move nên không bao giờ trôi lệch).
       Trong lúc kéo, item được chuyển sang #dragLayer (con trực tiếp của <body>) để position:fixed
       LUÔN tính theo viewport thật — nếu để nguyên bên trong .stage/.slide, một số trình duyệt (đặc
       biệt Safari) tính sai gốc toạ độ khi có overflow:hidden/animation ở tổ tiên, khiến item bị lệch
       hẳn xuống dưới thay vì nằm đúng con trỏ. ĐỂ TRÁNH LỖI "đứng hình" đã gặp trước đây (một số
       engine tự huỷ pointer capture nếu phần tử bị dời cha NGAY LÚC đang capture): thứ tự bắt buộc là
       dời cha TRƯỚC rồi mới setPointerCapture lúc bắt đầu kéo, và releasePointerCapture TRƯỚC rồi mới
       dời cha lúc thả — không bao giờ dời DOM trong lúc capture đang thật sự hoạt động.
       Thả xong luôn được trả về đúng chỗ: opts.onDrop tự chuyển node vào zone/tray, còn không truyền
       onDrop thì tự trả về đúng vị trí cũ (home). Engine.go() cũng dọn sạch #dragLayer mỗi lần chuyển
       slide nên không bao giờ mồ côi DOM dù học sinh bấm Next giữa lúc đang kéo.
       opts.zones(): hàm trả mảng phần tử đích hiện tại (gọi lại mỗi lần kéo — hỗ trợ zone đổi động).
       opts.onDrop(zoneEl|null, node): tự quyết định chấp nhận + tự appendChild node vào đâu đó.
       opts.axis: 'x'|'y' — khoá 1 trục (vd sắp thứ tự theo hàng ngang chỉ trượt trái/phải). */
    draggable(node, opts) {
      opts = opts || {};
      node.classList.add('drag-item');
      node.style.touchAction = 'none';
      let dragging = false, curZone = null, pid = null, w = 0, h = 0, lockX = 0, lockY = 0, homeParent = null, homeNext = null, downCX = 0, downCY = 0, moved = false;

      const zonesNow = () => (typeof opts.zones === 'function' ? opts.zones() : (opts.zones || []));
      const zoneAt = (cx, cy) => {
        let best = null, bestArea = Infinity;
        zonesNow().forEach(z => {
          const r = z.getBoundingClientRect();
          if (cx >= r.left && cx <= r.right && cy >= r.top && cy <= r.bottom) {
            const a = r.width * r.height;                    // zone lồng nhau -> ưu tiên zone nhỏ nhất
            if (a < bestArea) { best = z; bestArea = a; }
          }
        });
        return best;
      };
      const setOver = (z) => {
        if (curZone === z) return;
        if (curZone) curZone.classList.remove('over');
        curZone = z;
        if (curZone) curZone.classList.add('over');
      };
      const place = (cx, cy) => {                              // ép item nằm giữa (cx,cy) — gọi lại mỗi move, tự sửa lệch
        const px = opts.axis === 'y' ? lockX : cx;
        const py = opts.axis === 'x' ? lockY : cy;
        node.style.left = (px - w / 2) + 'px';
        node.style.top = (py - h / 2) + 'px';
      };
      const cleanupStyle = () => {
        node.style.position = ''; node.style.left = ''; node.style.top = '';
        node.style.width = ''; node.style.height = ''; node.style.margin = '';
      };
      const start = (e) => {
        if (dragging || node.classList.contains('locked')) return;
        if (e.button != null && e.button !== 0) return;        // chỉ chuột trái, chạm luôn button=0
        dragging = true;
        pid = e.pointerId;
        lockX = e.clientX; lockY = e.clientY;
        downCX = e.clientX; downCY = e.clientY; moved = false;
        const r = node.getBoundingClientRect();               // đo lúc còn ở vị trí gốc — kích thước đúng như hiển thị
        w = r.width; h = r.height;
        homeParent = node.parentNode; homeNext = node.nextSibling;    // để trả về đúng chỗ nếu opts.onDrop không tự lo
        (Engine._dragLayer || document.body).appendChild(node);       // dời cha TRƯỚC — chưa capture nên an toàn
        try { node.setPointerCapture(e.pointerId); } catch (err) {}   // capture SAU khi đã yên vị ở vị trí mới
        node.style.position = 'fixed';
        node.style.width = w + 'px'; node.style.height = h + 'px';
        node.style.margin = '0';
        place(e.clientX, e.clientY);                           // nhảy thẳng vào giữa con trỏ ngay khi nhấc lên, không giật
        node.classList.add('dragging');
        opts.onStart && opts.onStart(node);
        e.preventDefault();
      };
      const move = (e) => {
        if (!dragging || e.pointerId !== pid) return;
        if (!moved && Math.hypot(e.clientX - downCX, e.clientY - downCY) > 6) moved = true;
        place(e.clientX, e.clientY);
        setOver(zoneAt(e.clientX, e.clientY));
        opts.onMove && opts.onMove(node, curZone);
      };
      const finish = (e) => {
        if (!dragging || (e && e.pointerId !== pid)) return;
        dragging = false;
        try { node.releasePointerCapture(pid); } catch (err) {}  // release TRƯỚC khi dời cha trở lại
        node.classList.remove('dragging');
        const z = curZone; setOver(null);
        cleanupStyle();                                        // dọn style TRƯỚC khi di chuyển DOM
        pid = null;
        if (!moved) {
          /* chạm-nhả tại chỗ = 'tap' -> trả item về chỗ cũ và phát ddtap cho cơ chế bấm-chọn.
             Bắt buộc vì start() gọi preventDefault() nên trình duyệt không sinh 'click' tổng hợp. */
          if (homeNext && homeNext.parentNode === homeParent) homeParent.insertBefore(node, homeNext);
          else if (homeParent) homeParent.appendChild(node);
          node.dispatchEvent(new CustomEvent('ddtap', { bubbles: true }));
        } else if (opts.onDrop) opts.onDrop(z, node);
        else if (homeNext && homeNext.parentNode === homeParent) homeParent.insertBefore(node, homeNext);
        else if (homeParent) homeParent.appendChild(node);
      };
      this.on(node, 'pointerdown', start);
      this.on(node, 'pointermove', move);
      this.on(node, 'pointerup', finish);
      this.on(node, 'pointercancel', finish);
      this.on(node, 'lostpointercapture', finish);
      this.on(document, 'pointermove', move);
      this.on(document, 'pointerup', finish);
      this.on(document, 'pointercancel', finish);
      node.__ddLock = (v) => { node.classList.toggle('locked', !!v); if (v && dragging) finish({ pointerId: pid }); };
      return node;
    },

    /* dựng sẵn "kéo item vào ô đích" — dùng cho sort/order/match/cloze/jigsaw/sim.
       o.items: [{id,label?,...}]   o.zones: [{id,label?,accept:[itemId,...]|fn(item)=>bool,capacity?}]
       o.renderItem(item)->node     o.renderZone(zone)->node (mặc định .chip / .bin)
       o.tray: phần tử chứa item chưa thả (mặc định tự tạo .dd-tray.fixed)
       o.shuffle: mặc định true.
       Kéo-thả THẬT là chính; bấm-chọn (bấm item rồi bấm ô) luôn đi kèm làm dự phòng
       — không cần bật/tắt, tự hoạt động song song, không giành giật con trỏ.
       Trả {tray, zoneEls, place, check(), show(), reset()} — ghép thẳng vào ctx.buttons(). */
    dragDrop(o) {
      o = o || {};
      const self = this;
      const items = o.shuffle === false ? o.items.slice() : this.shuffle(o.items);
      const tray = o.tray || el('div', { class: 'dd-tray fixed' });
      const zoneEls = {};
      const nodes = {};
      const place = {};                                       // itemId -> zoneId hiện tại (null/undefined = trong tray)

      o.zones.forEach(z => {
        const zn = o.renderZone ? o.renderZone(z) : el('div', { class: 'card dd-zone bin', text: z.label || '' });
        zn.classList.add('dd-zone');
        zn.dataset.ddZone = z.id;
        zoneEls[z.id] = zn;
      });
      const zonesArr = () => Object.values(zoneEls);
      const acceptsItem = (zdef, it) => zdef && (typeof zdef.accept === 'function' ? zdef.accept(it) : (zdef.accept || []).indexOf(it.id) >= 0);
      const bump = (node) => { node.classList.remove('shake'); void node.offsetWidth; node.classList.add('shake'); };  // ô đầy -> rung nhẹ, KHÔNG chấm đúng/sai (chỉ Check mới chấm)

      const pickOthers = (except) => {
        Object.values(nodes).forEach(n => { if (n !== except) n.classList.remove('picked'); });
      };

      items.forEach(it => {
        const node = o.renderItem ? o.renderItem(it) : el('div', { class: 'chip', text: it.label != null ? it.label : it.id });
        node.classList.add('drag-item');
        node.dataset.ddId = it.id;
        self.draggable(node, {
          zones: zonesArr,
          onDrop: (zoneEl, n) => {
            self.clearResult(n);                                          // đổi chỗ -> xoá dấu đúng/sai cũ, chờ Check lại
            if (!zoneEl) { place[it.id] = null; tray.appendChild(n); return; }
            const zdef = o.zones.find(z => z.id === zoneEl.dataset.ddZone);
            const already = Array.from(zoneEl.children).filter(c => c !== n && c.classList.contains('drag-item')).length;
            if (zdef && zdef.capacity && already >= zdef.capacity) {
              bump(zoneEl);
              const homeId = place[it.id];
              (homeId && zoneEls[homeId] ? zoneEls[homeId] : tray).appendChild(n);
              return;
            }
            place[it.id] = zdef ? zdef.id : null;
            zoneEl.appendChild(n);
          }
        });
        /* bấm-chọn dự phòng: bấm item rồi bấm ô đích — song song với kéo-thả, không thay thế.
           Lắng cả 'click' (chuột thường) và 'ddtap' (đường chính trên bảng tương tác/cảm ứng). */
        const pickToggle = () => {
          if (node.classList.contains('dragging')) return;
          const was = node.classList.contains('picked');
          pickOthers(node);
          node.classList.toggle('picked', !was);
        };
        self.on(node, 'click', pickToggle);
        self.on(node, 'ddtap', pickToggle);
        nodes[it.id] = node;
        tray.appendChild(node);
      });

      zonesArr().forEach(zn => {
        self.on(zn, 'click', () => {
          const picked = Object.values(nodes).find(n => n.classList.contains('picked'));
          if (!picked) return;
          picked.classList.remove('picked');
          self.clearResult(picked);                                        // đổi chỗ -> xoá dấu đúng/sai cũ, chờ Check lại
          const it = items.find(i => i.id === picked.dataset.ddId);
          const zdef = o.zones.find(z => z.id === zn.dataset.ddZone);
          const already = Array.from(zn.children).filter(c => c !== picked && c.classList.contains('drag-item')).length;
          if (zdef && zdef.capacity && already >= zdef.capacity) { bump(zn); return; }
          place[it.id] = zdef.id;
          zn.appendChild(picked);
        });
      });

      return {
        tray, zoneEls, place,
        check() {
          let correct = 0;
          items.forEach(it => {
            const zid = place[it.id] || null;
            const zdef = zid ? o.zones.find(z => z.id === zid) : null;
            const ok = !!zdef && acceptsItem(zdef, it);
            if (ok) correct++;
            self.markResult(nodes[it.id], ok);
          });
          return { correct, total: items.length };
        },
        show() {
          items.forEach(it => {
            self.clearResult(nodes[it.id]);
            const correctZone = o.zones.find(z => acceptsItem(z, it));
            if (correctZone) { zoneEls[correctZone.id].appendChild(nodes[it.id]); place[it.id] = correctZone.id; }
          });
        },
        reset() {
          items.forEach(it => {
            self.clearResult(nodes[it.id]);
            nodes[it.id].classList.remove('picked');
            place[it.id] = null;
            tray.appendChild(nodes[it.id]);
          });
        }
      };
    },

    /* đánh dấu đúng/sai RÕ RÀNG: viền+nền màu + rung nếu sai + icon ✓/✗ nổi trên item
       (không chỉ dựa vào màu — an toàn cho học sinh mù màu, rõ trên TV xa).
       Dùng cho mọi mech, không riêng kéo-thả: quiz, hotspot, match...
       KHÔNG tự phát âm mặc định: khi chấm nhiều item cùng lúc (vd dragDrop().check() chấm cả tray),
       gọi markResult liên tiếp trong 1 vòng lặp mà mỗi lần đều phát âm sẽ giẫm chân nhau (âm sau cắt
       ngang âm trước vì Sound.playEffect dùng chung 1 thẻ audio) -> nghe như KHÔNG có âm thanh. Theo
       đúng luật "chấm toàn bộ 1 lần" (interactions.md), CHỈ Engine.score() phát 1 âm ok/bad DUY NHẤT
       cho cả lượt Check — ctx.buttons() đã tự gọi việc này, không cần gọi lại ở đây. Muốn phát âm
       ngay tại chỗ cho 1 item đơn lẻ (ngoài luồng Check gộp) thì truyền {sound:true}. */
    markResult(node, ok, o) {
      o = o || {};
      node.classList.remove('is-ok', 'is-bad', 'shake');
      const oldBadge = node.querySelector(':scope > .fb-badge');
      if (oldBadge) oldBadge.remove();
      void node.offsetWidth;                                  // ép reflow để retrigger animation/shake
      node.classList.add(ok ? 'is-ok' : 'is-bad');
      if (!ok && o.shake !== false) node.classList.add('shake');
      if (o.badge !== false) {
        if (getComputedStyle(node).position === 'static') node.classList.add('fb-anchor');
        node.appendChild(el('i', { class: 'fb-badge ' + (ok ? 'ok' : 'bad'), text: ok ? '✓' : '✗' }));
      }
      if (o.sound) Sound.playEffect(ok ? 'ok' : 'bad');
      return node;
    },
    clearResult(node) {
      node.classList.remove('is-ok', 'is-bad', 'shake', 'fb-anchor');
      const b = node.querySelector(':scope > .fb-badge');
      if (b) b.remove();
      return node;
    }
  };

  /* ---------- Engine ---------- */
  const Engine = {
    slides: [], idx: -1, ctx: null, cfg: {},
    stars: 0, streak: 0, done: {}, wrong: [],

    register(def) { this.slides.push(def); return this; },
    registerAll(list) { list.forEach(d => this.register(d)); return this; },

    /* ---- khởi động ---- */
    start(cfg) {
      this.cfg = cfg || {};
      document.title = this.cfg.title || 'Lesson';
      if (this.cfg.accent) document.documentElement.style.setProperty('--accent', this.cfg.accent);
      if (this.cfg.accent2) document.documentElement.style.setProperty('--accent-2', this.cfg.accent2);
      if (this.cfg.bg) document.documentElement.style.setProperty('--bg-base', this.cfg.bg);

      global.addEventListener('error', e => console.error('[global]', e.message));
      global.addEventListener('unhandledrejection', e => console.error('[global] rejection', e.reason));

      Sound.init(this.cfg.sfx, this.cfg.voice);
      this._buildChrome();
      this._applyFontScale(Store.pref('fs') || 1);

      this.stars = Store.sess('stars') || 0;
      this.done = Store.sess('done') || {};
      this._paintStars();

      const resume = Store.sess('idx');
      const hasProgress = resume != null && resume > 0;
      const boot = () => {
        if (hasProgress) this._resumeDialog(resume);
        else { Store.sess('start', Date.now()); this.go(0, 'jump'); }
      };
      if (Store.sess('introSeen') || reduceMotion()) boot(); else this._intro(boot);

      /* API cho script QA */
      global.__deck = {
        count: () => this.slides.length,
        meta: () => this.slides.map((s, i) => ({ i: i, id: s.id, title: s.title, section: s.section, mech: s.mech })),
        go: (i) => this.go(i, 'jump'),
        scrollOK: () => document.documentElement.scrollHeight <= global.innerHeight,
        setFontScale: (v) => this._applyFontScale(v),
        voice: () => (Sound._voice ? Sound._voice.name : null),
        voices: () => Sound.all().map(v => ({ name: v.name, lang: v.lang, fun: Sound.isFun(v) })),
        setVoice: (n) => { const v = Sound.setVoice(n); return v ? v.name : null; },
        openVoices: () => this._openVoices()
      };
    },

    /* ---- khung cố định: navbar, stage, lớp nổi ---- */
    _buildChrome() {
      const app = el('div', { id: 'app' });
      const nav = el('div', { class: 'navbar' });

      const brand = el('div', { class: 'brand' });
      if (this.cfg.logo) brand.appendChild(el('img', { src: this.cfg.logo, alt: 'Logo' }));
      nav.appendChild(brand);
      nav.appendChild(el('div', { class: 'lesson-title', text: this.cfg.title || '' }));
      nav.appendChild(el('div', { class: 'spacer' }));

      this._starsEl = el('div', { class: 'stars', text: '⭐ 0' });
      this._streakEl = el('div', { class: 'streak' });
      nav.append(this._starsEl, this._streakEl);

      const fsg = el('div', { class: 'fs-group' });
      const bDown = el('button', { class: 'iconbtn', text: 'A⁻', title: 'Smaller text' });
      const val = el('div', { class: 'fs-val', text: '100%' });
      const bUp = el('button', { class: 'iconbtn', text: 'A⁺', title: 'Bigger text' });
      bDown.addEventListener('click', safe(() => this._applyFontScale((Store.pref('fs') || 1) - .1)));
      bUp.addEventListener('click', safe(() => this._applyFontScale((Store.pref('fs') || 1) + .1)));
      val.addEventListener('click', safe(() => this._applyFontScale(1)));
      fsg.append(bDown, val, bUp); nav.appendChild(fsg);
      this._fsVal = val;

      const bMute = el('button', { class: 'iconbtn', text: Sound.muted() ? '🔇' : '🔊', title: 'Mute all' });
      bMute.addEventListener('click', safe(() => { Sound.setMuted(!Sound.muted()); bMute.textContent = Sound.muted() ? '🔇' : '🔊'; }));
      nav.appendChild(bMute);

      if (Sound.supported()) {
        const bVoice = el('button', { class: 'iconbtn', id: 'voiceBtn', text: '🗣', title: 'Voice settings' });
        bVoice.addEventListener('click', safe(() => this._openVoices()));
        nav.appendChild(bVoice);
      }

      /* ---- bảng điểm 2 đội: hoạt động cả lớp trên bảng tương tác ---- */
      this._teamsEl = el('div', { class: 'teams teacher-only' });
      this._teamScore = Store.sess('teams') || [0, 0];
      ['a', 'b'].forEach((side, i) => {
        const tm = el('div', { class: 'tm ' + side });
        const minus = el('button', { text: '−', title: 'Minus' });
        const val = el('span', { text: String(this._teamScore[i]) });
        const plus = el('button', { text: '+', title: 'Plus' });
        const upd = (d) => {
          this._teamScore[i] = Math.max(0, this._teamScore[i] + d);
          val.textContent = String(this._teamScore[i]);
          Store.sess('teams', this._teamScore);
          if (d > 0) { Sound.playEffect('ok'); this.confetti(); }
        };
        minus.addEventListener('click', safe(() => upd(-1)));
        plus.addEventListener('click', safe(() => upd(1)));
        tm.append(el('span', { text: i ? '🔵' : '🔴' }), minus, val, plus);
        this._teamsEl.appendChild(tm);
      });
      nav.appendChild(this._teamsEl);

      const bTimer = el('button', { class: 'iconbtn teacher-only', text: '⏱', title: 'Timer (1 min)' });
      bTimer.addEventListener('click', safe(() => this.timer(this._cdRun ? 0 : 60)));
      nav.appendChild(bTimer);

      const bSpot = el('button', { class: 'iconbtn', text: '🔦', title: 'Spotlight (S)' });
      bSpot.addEventListener('click', safe(() => this.spotlight()));
      nav.appendChild(bSpot);

      const bMenu = el('button', { class: 'iconbtn teacher-only', text: '☰', title: 'Slides' });
      bMenu.addEventListener('click', safe(() => this._openMenu()));
      nav.appendChild(bMenu);

      /* Khoá giáo viên: học sinh lên bảng thao tác, không bấm nhầm nút quản trị. */
      const bLock = el('button', { class: 'iconbtn', id: 'tlockBtn', text: '🔒', title: 'Teacher lock (L)' });
      bLock.addEventListener('click', safe(() => this.teacherLock()));
      nav.appendChild(bLock);
      this._lockBtn = bLock;

      if (document.fullscreenEnabled) {
        const bFull = el('button', { class: 'iconbtn', id: 'fullscreenBtn', text: '⛶', title: 'Fullscreen' });
        bFull.addEventListener('click', safe(() => this.toggleFullscreen()));
        const sync = () => { bFull.textContent = document.fullscreenElement ? '⛉' : '⛶'; };
        document.addEventListener('fullscreenchange', sync);
        document.addEventListener('webkitfullscreenchange', sync);
        nav.appendChild(bFull);
      }

      const bPrev = el('button', { class: 'iconbtn', text: '‹', title: 'Previous' });
      const bNext = el('button', { class: 'iconbtn', text: '›', title: 'Next' });
      bPrev.addEventListener('click', safe(() => this.prev()));
      bNext.addEventListener('click', safe(() => this.next()));
      nav.append(bPrev, bNext);

      const prog = el('div', { class: 'progress' }, [el('i')]);
      this._prog = prog.firstChild;
      this._stage = el('div', { class: 'stage' });
      app.append(nav, prog, this._stage);
      document.body.appendChild(app);

      this._toast = el('div', { class: 'toast' });
      this._lb = el('div', { class: 'lightbox' }, [el('img', { alt: '' })]);
      this._lb.addEventListener('click', () => this._lb.classList.remove('on'));
      this._modal = el('div', { class: 'modal' }, [el('div', { class: 'sheet' })]);
      this._modal.addEventListener('click', e => { if (e.target === this._modal) this._modal.classList.remove('on'); });
      this._dragLayer = el('div', { id: 'dragLayer' });        // item đang kéo nổi lên đây, xem ctx.draggable()
      this._cdown = el('div', { class: 'cdown' });
      this._spot = el('div', { class: 'spot' });
      document.body.append(this._toast, this._lb, this._modal, this._dragLayer, this._cdown, this._spot);

      document.addEventListener('keydown', safe(e => {
        if (e.target && /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
        const k = e.key;
        if (k === 'Escape') { this._modal.classList.remove('on'); this._lb.classList.remove('on'); this.spotlight(false); return; }
        /* Bút trình chiếu (clicker) gửi PageDown/PageUp hoặc Space, KHÔNG gửi mũi tên —
           thiếu 2 phím này là cả tiết dạy phải bấm chuột trên bảng. */
        if (k === 'ArrowRight' || k === 'PageDown' || k === 'ArrowDown' || k === ' ' || k === 'Spacebar') { e.preventDefault(); this.next(); }
        else if (k === 'ArrowLeft' || k === 'PageUp' || k === 'ArrowUp') { e.preventDefault(); this.prev(); }
        else if (k === 'Home') { e.preventDefault(); this.go(0, 'jump'); }
        else if (k === 'End') { e.preventDefault(); this.go(this.slides.length - 1, 'jump'); }
        else if (k === 'f' || k === 'F') this.toggleFullscreen();
        else if (k === 's' || k === 'S') this.spotlight();
        else if (k === 'l' || k === 'L') this.teacherLock();
      }));

      /* gợn sóng tại điểm chạm cho MỌI phần tử bấm được */
      document.addEventListener('pointerdown', safe(e => {
        const t = e.target && e.target.closest && e.target.closest('.btn, .iconbtn, .cell, .chip, .drag-item, .dd-item, .fc, .hotwrap');
        if (!t) return;
        const r = el('div', { class: 'ripple' });
        r.style.left = e.clientX + 'px'; r.style.top = e.clientY + 'px';
        document.body.appendChild(r);
        setTimeout(() => r.remove(), 520);
      }), { passive: true });
    },

    /* ---- công cụ giờ dạy ---- */
    /* Đếm ngược chiếu to giữa bảng. sec=0 để tắt. Dùng cho hoạt động nhóm có giới hạn thời gian. */
    timer(sec) {
      clearInterval(this._cdRun); this._cdRun = null;
      if (!sec) { this._cdown.classList.remove('on', 'warn'); return; }
      let left = sec;
      const draw = () => {
        const m = Math.floor(left / 60), s = left % 60;
        this._cdown.textContent = '⏱ ' + m + ':' + String(s).padStart(2, '0');
        this._cdown.classList.toggle('warn', left <= 10);
      };
      this._cdown.classList.add('on'); draw();
      this._cdRun = setInterval(safe(() => {
        left--;
        if (left <= 0) {
          clearInterval(this._cdRun); this._cdRun = null;
          this._cdown.textContent = '⏰ Time!';
          Sound.playEffect('bad');
          setTimeout(() => this._cdown.classList.remove('on', 'warn'), 2500);
          return;
        }
        draw();
      }), 1000);
    },

    /* Đèn rọi theo điểm chạm/con trỏ — dồn chú ý vào 1 chi tiết khi giảng. */
    spotlight(on) {
      const want = on === undefined ? !this._spot.classList.contains('on') : !!on;
      this._spot.classList.toggle('on', want);
      if (want && !this._spotMove) {
        this._spotMove = safe(e => {
          this._spot.style.setProperty('--spot-x', e.clientX + 'px');
          this._spot.style.setProperty('--spot-y', e.clientY + 'px');
        });
        document.addEventListener('pointermove', this._spotMove, { passive: true });
        document.addEventListener('pointerdown', this._spotMove, { passive: true });
      }
    },

    /* Ẩn nút quản trị khi học sinh đang thao tác trên bảng. */
    teacherLock(on) {
      const want = on === undefined ? !document.body.classList.contains('tlock') : !!on;
      document.body.classList.toggle('tlock', want);
      if (this._lockBtn) {
        this._lockBtn.classList.toggle('on', want);
        this._lockBtn.textContent = want ? '🔓' : '🔒';
      }
      this.toast(want ? 'Student mode — teacher tools hidden' : 'Teacher mode');
    },

    toggleFullscreen() {
      const p = document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
      if (p && p.catch) p.catch(e => console.warn('[fullscreen]', e));
    },
    _applyFontScale(v) {
      v = Math.min(1.5, Math.max(0.8, Math.round(v * 10) / 10));
      document.documentElement.style.setProperty('--fs-scale', v);
      Store.pref('fs', v);
      if (this._fsVal) this._fsVal.textContent = Math.round(v * 100) + '%';
    },

    /* ---- điều hướng + error boundary theo từng slide ---- */
    go(i, dir) {
      if (i < 0 || i >= this.slides.length || this._busy) return;
      this._busy = true;
      Sound.stopAll();
      if (this.ctx) {
        try { this.ctx.def.destroy && this.ctx.def.destroy(); } catch (e) { console.error('[destroy]', e); }
        this.ctx.cleanup();
        this.ctx = null;
      }
      this._stage.innerHTML = '';
      if (this._dragLayer) this._dragLayer.innerHTML = '';    // dọn phòng học sinh bấm Next giữa lúc đang kéo
      const def = this.slides[i];
      const node = el('div', { class: 'slide ' + (dir === 'prev' ? 'dir-prev' : dir === 'jump' ? 'dir-jump' : 'dir-next') });
      void node.offsetWidth;
      this._stage.appendChild(node);
      const ctx = new SlideCtx(node, def);
      this.ctx = ctx;
      try {
        def.render && def.render(node, ctx);
        def.init && def.init(node, ctx);
      } catch (e) {
        console.error('[slide ' + def.id + ']', e);
        node.innerHTML = '';
        node.appendChild(el('div', { class: 'card center-col grow', text: "This activity couldn't load — tap Next to continue." }));
      }
      this.idx = i;
      Store.sess('idx', i);
      this._prog.style.width = ((i + 1) / this.slides.length * 100) + '%';
      setTimeout(() => { this._busy = false; }, 60);
      /* gỡ class hướng sau khi chuyển cảnh xong — nếu để lại, cổng armed() của ctx.hotspots()
         sẽ chặn click vĩnh viễn trên mọi slide kể từ lần chuyển đầu tiên. */
      setTimeout(() => { node.classList.remove('dir-next', 'dir-prev', 'dir-jump'); }, 520);
    },
    next() { if (this.idx < this.slides.length - 1) { this.done[this.slides[this.idx].id] = 1; Store.sess('done', this.done); this.go(this.idx + 1, 'next'); } },
    prev() { if (this.idx > 0) this.go(this.idx - 1, 'prev'); },

    /* ---- điểm ---- */
    addStars(n) { this.stars = Math.max(0, this.stars + n); Store.sess('stars', this.stars); this._paintStars(); },
    _paintStars() { if (this._starsEl) this._starsEl.textContent = '⭐ ' + this.stars; },
    score(correct, total) {
      const all = correct === total;
      if (all) { this.streak++; this.addStars(1); Sound.playEffect('ok'); if (this.streak >= 2) this.toast('🔥 ' + this.streak + ' in a row!'); this.confetti(); }
      else {
        this.streak = 0; Sound.playEffect('bad');
        const id = this.slides[this.idx] && this.slides[this.idx].id;
        if (id && this.wrong.indexOf(id) < 0 && !this.done[id]) this.wrong.push(id);
      }
      this._streakEl.textContent = this.streak >= 2 ? '🔥 ' + this.streak : '';
      this.done[this.slides[this.idx].id] = 1; Store.sess('done', this.done);
      Store.sess('wrong', this.wrong);
    },
    wrongList() { return Store.sess('wrong') || this.wrong; },

    /* ---- lớp nổi ---- */
    toast(msg) {
      this._toast.textContent = msg;
      this._toast.classList.add('on');
      clearTimeout(this._tt);
      this._tt = setTimeout(() => this._toast.classList.remove('on'), 2200);
    },
    lightbox(src, alt) { const im = this._lb.querySelector('img'); im.src = src; im.alt = alt || ''; this._lb.classList.add('on'); },
    _sheet() { const s = this._modal.querySelector('.sheet'); s.innerHTML = ''; this._modal.classList.add('on'); return s; },

    _openMenu() {
      const s = this._sheet();
      s.appendChild(el('div', { class: 'h2', text: 'Slides' }));
      let sec = null;
      this.slides.forEach((d, i) => {
        if (d.section && d.section !== sec) { sec = d.section; s.appendChild(el('div', { class: 'menu-section', text: sec })); }
        const b = el('button', { class: 'menu-item' + (i === this.idx ? ' current' : '') }, [
          el('span', { class: 'num', text: String(i + 1) }),
          el('span', { text: d.title || d.id }),
          el('span', { text: this.done[d.id] ? ' ✓' : '' })
        ]);
        b.addEventListener('click', safe(() => { this._modal.classList.remove('on'); this.go(i, 'jump'); }));
        s.appendChild(b);
      });
      const nc = el('button', { class: 'btn btn-reset', text: '🔄 New Class' });
      nc.addEventListener('click', safe(() => this.newClass()));
      s.appendChild(nc);
    },
    /* ---- bảng chọn giọng: giáo viên tự đổi giọng có trên máy ---- */
    _openVoices() {
      const s = this._sheet();
      s.appendChild(el('div', { class: 'h2', text: '🗣 Voice' }));

      const all = Sound.all();
      if (!all.length) {
        s.appendChild(el('div', { class: 'muted', text: 'Đang nạp danh sách giọng… mở lại sau 1-2 giây.' }));
        return;
      }

      /* ô nghe thử: gõ chữ bất kỳ để test đúng nội dung bài */
      const sample = el('input', {
        class: 'menu-item', style: 'width:100%',
        value: Store.pref('sample') || 'Hello! This is my voice.'
      });
      s.append(el('div', { class: 'menu-section', text: 'Câu nghe thử' }), sample);

      /* tốc độ đọc */
      const rateRow = el('div', { class: 'menu-item', style: 'gap:14px' });
      const rateVal = el('span', { style: 'min-width:4.5em', text: 'x' + Sound.rateAdj().toFixed(2) });
      const rate = el('input', { type: 'range', min: '0.6', max: '1.3', step: '0.05', value: String(Sound.rateAdj()), style: 'flex:1 1 auto' });
      rate.addEventListener('input', safe(() => { rateVal.textContent = 'x' + Sound.rateAdj(parseFloat(rate.value)).toFixed(2); }));
      rateRow.append(el('span', { text: 'Speed' }), rate, rateVal);
      s.append(el('div', { class: 'menu-section', text: 'Tốc độ đọc (áp dụng cho toàn bài)' }), rateRow);

      /* danh sách giọng */
      const listWrap = el('div');
      const cur = Sound.current();
      const auto = !Store.pref('voiceLocked');

      const rowFor = (v) => {
        const row = el('button', { class: 'menu-item' + (cur && v.name === cur.name ? ' current' : ''), style: 'width:100%' });
        row.append(
          el('span', { style: 'flex:1 1 auto;text-align:left', text: v.name }),
          el('span', { class: 'muted', text: v.lang + (Sound.isFun(v) ? ' · 🎭 fun' : '') })
        );
        const play = el('span', { text: '▶', style: 'padding:0 .4em' });
        play.addEventListener('click', safe(e => {
          e.stopPropagation();
          Store.pref('sample', sample.value);
          Sound.preview(v.name, sample.value);
        }));
        row.appendChild(play);
        row.addEventListener('click', safe(() => {
          Sound.setVoice(v.name);
          Store.pref('sample', sample.value);
          listWrap.querySelectorAll('.menu-item').forEach(n => n.classList.remove('current'));
          row.classList.add('current');
          autoBtn.classList.remove('current');
          Sound.preview(v.name, sample.value);
          this.toast('Voice: ' + v.name);
        }));
        return row;
      };

      const autoBtn = el('button', { class: 'menu-item' + (auto ? ' current' : ''), style: 'width:100%' }, [
        el('span', { style: 'flex:1 1 auto;text-align:left', text: '⚙️ Auto (khuyên dùng)' }),
        el('span', { class: 'muted', text: 'tự chọn giọng tiếng Anh tốt nhất, bỏ giọng hiệu ứng' })
      ]);
      autoBtn.addEventListener('click', safe(() => {
        const v = Sound.setVoice(null);
        listWrap.querySelectorAll('.menu-item').forEach(n => n.classList.remove('current'));
        autoBtn.classList.add('current');
        this.toast('Voice: auto' + (v ? ' → ' + v.name : ''));
      }));
      s.append(el('div', { class: 'menu-section', text: 'Giọng đọc trên máy này (' + all.length + ')' }), autoBtn);

      const en = all.filter(v => /^en/i.test(v.lang) && !Sound.isFun(v));
      const fun = all.filter(v => Sound.isFun(v));
      const other = all.filter(v => !/^en/i.test(v.lang) && !Sound.isFun(v));
      const group = (label, arr) => {
        if (!arr.length) return;
        listWrap.appendChild(el('div', { class: 'menu-section', text: label }));
        arr.forEach(v => listWrap.appendChild(rowFor(v)));
      };
      group('English (' + en.length + ')', en);
      group('Giọng hiệu ứng — vui nhưng khó nghe khi dạy (' + fun.length + ')', fun);
      group('Ngôn ngữ khác (' + other.length + ')', other);
      s.appendChild(listWrap);

      const close = el('button', { class: 'btn btn-primary', text: 'Done' });
      close.addEventListener('click', safe(() => { Store.pref('sample', sample.value); this._modal.classList.remove('on'); Sound.stopAll(); }));
      s.appendChild(close);
    },

    newClass() {
      Store.clearSession();
      this.stars = 0; this.streak = 0; this.done = {}; this.wrong = [];
      this._paintStars(); this._streakEl.textContent = '';
      Store.sess('start', Date.now());
      this._modal.classList.remove('on');
      this.go(0, 'jump');
    },
    _resumeDialog(resume) {
      const s = this._sheet();
      s.append(
        el('div', { class: 'h2', text: 'Continue previous progress?' }),
        el('div', { class: 'muted', text: 'Slide ' + (resume + 1) + ' • ⭐ ' + this.stars })
      );
      const row = el('div', { class: 'btnrow' });
      const a = el('button', { class: 'btn btn-primary', text: 'Continue' });
      const b = el('button', { class: 'btn', text: 'Start new class' });
      a.addEventListener('click', safe(() => { this._modal.classList.remove('on'); this.go(resume, 'jump'); }));
      b.addEventListener('click', safe(() => this.newClass()));
      row.append(a, b); s.appendChild(row);
    },

    /* ---- confetti / particle ---- */
    confetti(kind) {
      if (reduceMotion() || !Element.prototype.animate) return;
      const host = this._stage; const n = 26;
      const colors = [getComputedStyle(document.documentElement).getPropertyValue('--accent'),
      getComputedStyle(document.documentElement).getPropertyValue('--accent-2'), '#FBBF24', '#60A5FA'];
      for (let i = 0; i < n; i++) {
        const p = el('i', {
          style: `position:absolute;left:${50 + (Math.random() - .5) * 40}%;top:55%;width:${6 + Math.random() * 8}px;height:${6 + Math.random() * 8}px;` +
            `background:${colors[i % colors.length]};border-radius:${kind === 'star' ? '2px' : '999px'};pointer-events:none;z-index:2;`
        });
        host.appendChild(p);
        const dx = (Math.random() - .5) * 460, dy = -(120 + Math.random() * 320);
        p.animate([{ transform: 'translate(0,0)', opacity: 1 }, { transform: `translate(${dx}px,${dy}px) rotate(${Math.random() * 540}deg)`, opacity: 0 }],
          { duration: 900 + Math.random() * 700, easing: 'cubic-bezier(.2,.7,.3,1)' }).onfinish = () => p.remove();
      }
    },

    /* ---- intro 1 lần/phiên ---- */
    _intro(done) {
      const title = this.cfg.title || 'Lesson';
      const v = el('div', { class: 'intro' });
      const h = el('div', { class: 'h1' });
      title.split(' ').forEach((w, i) => {

Engine.register({

  render(root, ctx) {
    root.appendChild(h('div', { class: 'pill fixed', text: 'Exercise 4 (P.21): Write the chemical formulas' }));

    const R = { I: 1, II: 2, III: 3, IV: 4 };
    const C = [
      { nm: 'Salt', e: [['Na', 'I'], ['Cl', 'I']], ans: [1, 1] },

      const card = h('div', { class: 'cmp' });
      const st = [0, 0];   /* 0 = chưa chọn: không ô nào "đúng sẵn" khi chưa làm */
      const syms = [], tots = [];
      const bal = h('div', { class: 'bal' });

        c.e.forEach((e, k) => { syms[k].innerHTML = e[0] + (st[k] === 0 ? '<sub class="q">?</sub>' : st[k] > 1 ? '<sub>' + st[k] + '</sub>' : ''); tots[k].textContent = st[k] ? R[e[1]] * st[k] : '–'; });
        bal.classList.toggle('even', st[0] > 0 && st[1] > 0 && R[c.e[0][1]] * st[0] === R[c.e[1][1]] * st[1]);
        ctx.clearResult(card);
      };
      const els = h('div', { class: 'els' });

        const sym = h('div', { class: 'sym' }); syms.push(sym);
        const up = h('button', { text: '▲', 'aria-label': 'More ' + e[0] }), dn = h('button', { text: '▼', 'aria-label': 'Fewer ' + e[0] });
        ctx.on(up, 'click', () => { if (st[k] < 4) { st[k]++; Sound.playEffect('click'); paint(); } });
        ctx.on(dn, 'click', () => { if (st[k] > 1) { st[k]--; Sound.playEffect('click'); paint(); } });
        els.appendChild(h('div', { class: 'el' }, [h('div', { class: 'val', text: e[1] }), sym, h('div', { class: 'stp' }, [up, dn])]));

<script>
/* __VISUAL_SYSTEM__ */
(function (global) {
  'use strict';
  if (global.Lab) return;
  var NS = 'http://www.w3.org/2000/svg';
  var Lab = {};
  global.Lab = Lab;

  function sv(tag, attrs, kids) {
    var n = document.createElementNS(NS, tag);
    if (attrs) for (var k in attrs) n.setAttribute(k, attrs[k]);
    (kids || []).forEach(function (c) { if (c) n.appendChild(c); });
    return n;
  }
  Lab.sv = sv;
  function dv(cls, txt) { var d = document.createElement('div'); if (cls) d.className = cls; if (txt != null) d.textContent = txt; return d; }
  Lab.dv = dv;

  /* ===== 1. TẦNG NỀN THEO PHẦN HỌC (nằm ngoài .slide) ===== */
  /* Mỗi SECTION tự nhận 1 bảng màu theo thứ tự xuất hiện -> đổi bài không phải sửa gì.
     Chỉ định tay: Lab.PAL = { 'Tên section': ['#..','#..','#..'] }. */
  var POOL = [
    ['#5EEAD4', '#93C5FD', '#A7F3D0'],
    ['#7DD3FC', '#BAE6FD', '#5EEAD4'],
    ['#34D399', '#A3E635', '#A7F3D0'],
    ['#2DD4BF', '#34D399', '#93C5FD'],
    ['#A5B4FC', '#93C5FD', '#C7D2FE'],
    ['#FCD34D', '#A3E635', '#FDE68A']
  ];
  var palMap = null;
  function palFor(key) {
    if (!palMap) {
      palMap = {};
      var seen = [];
      Engine.slides.forEach(function (s) { var k = s.section || '-'; if (seen.indexOf(k) < 0) seen.push(k); });
      seen.forEach(function (k, i) { palMap[k] = POOL[i % POOL.length]; });
    }
    return (Lab.PAL && Lab.PAL[key]) || palMap[key] || POOL[0];
  }
  function rgba(hex, a) {
    var h = hex.replace('#', '');
    return 'rgba(' + parseInt(h.slice(0,2),16) + ',' + parseInt(h.slice(2,4),16) + ',' + parseInt(h.slice(4,6),16) + ',' + a + ')';
  }

  /* Khung gần trung tính, màu CHỈ ở 2 góc, giữa màn hình sạch tuyệt đối:
     không có gì nằm sau vùng chữ -> mắt không bị nhiễu. */
  function sceneD(c) {
    var sc = dv('scene');
    sc.style.background = 'linear-gradient(180deg,#FFFFFF 0%,#F7FBF9 56%,#EEF6F2 100%)';
    var tr = dv('deco');
    tr.style.right = '-16vw'; tr.style.top = '-34vh'; tr.style.width = '62vw'; tr.style.height = '62vw';
    tr.style.borderRadius = '50%'; tr.style.opacity = '1';
    tr.style.background = 'radial-gradient(circle at 50% 50%,' + rgba(c[0], .26) + ' 0%,' + rgba(c[0], 0) + ' 66%)';
    sc.appendChild(tr);
    var bl = dv('deco');
    bl.style.left = '-20vw'; bl.style.bottom = '-32vh'; bl.style.width = '56vw'; bl.style.height = '56vw';
    bl.style.borderRadius = '50%'; bl.style.opacity = '1';
    bl.style.background = 'radial-gradient(circle at 50% 50%,' + rgba(c[2], .22) + ' 0%,' + rgba(c[2], 0) + ' 66%)';
    sc.appendChild(bl);
    return sc;
  }

  var STYLES = { D: sceneD };
  Lab.bgStyle = 'P';   /* bài này: giữ hình nền gốc của PPT (scenePPT, cuối file) */
  function buildScene(key) { if (Lab.bgStyle === 'P') return scenePPT(key); return (STYLES[Lab.bgStyle] || sceneD)(palFor(key)); }

  var bgHost = null, curScene = null, curKey = null;
  function applyScene() {
    if (!bgHost) {
      bgHost = document.getElementById('bgLayer');
      if (!bgHost) { bgHost = dv(''); bgHost.id = 'bgLayer'; document.body.insertBefore(bgHost, document.body.firstChild); }
    }
    var def = Engine.slides[Engine.idx];
    var key = Lab.bgStyle === 'P' ? ((def && def.bg) || 'cloud') : ((def && def.section) || '-');
    document.body.setAttribute('data-bg', Lab.bgStyle === 'P' ? key : '');
    if (key === curKey && !Lab.__force) return;
    Lab.__force = false;
    curKey = key;
    var next = buildScene(key);
    bgHost.appendChild(next);
    void next.offsetWidth;
    next.classList.add('on');
    var old = curScene;
    curScene = next;
    if (old) setTimeout(function () { if (old.parentNode) old.parentNode.removeChild(old); }, 700);
  }

  /* ===== 2. fitStage() — lưới an toàn chống vỡ =====
     Dùng biến CSS, KHÔNG transform:scale() lên .slide: tổ tiên có transform
     sẽ phá position:fixed của #dragLayer. */
  var fitRaf = 0, fitTries = 0;
  function curSlide() { return document.querySelector('.stage > .slide'); }
  function minFit() {
    var fs = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--fs-scale')) || 1;
    return Math.min(1, 0.72 / fs);
  }
  /* Sàn CHÍNH XÁC cho từng slide: đo cỡ chữ NHỎ NHẤT đang hiện ở --fit = 1, rồi cho co
     đúng tới lúc cỡ đó chạm ngưỡng đọc được từ cuối lớp (1/40 chiều cao màn hình, tối
     thiểu 22px). Bỏ qua chữ trong <svg> vì nó co theo khung hình, không theo --fit. */
  function textFloor(slide) {
    var th = Math.max(22, global.innerHeight / 40);
    var min = Infinity;
    var nodes = slide.querySelectorAll('*');
    for (var i = 0; i < nodes.length; i++) {
      var n = nodes[i];
      if (n.ownerSVGElement || n.tagName.toLowerCase() === 'svg') continue;
      var hasText = false;
      for (var c = n.firstChild; c; c = c.nextSibling) {
        if (c.nodeType === 3 && c.nodeValue.trim()) { hasText = true; break; }
      }
      if (!hasText) continue;
      var r = n.getBoundingClientRect();
      if (!r.width || !r.height) continue;
      var fsz = parseFloat(getComputedStyle(n).fontSize);
      if (fsz && fsz < min) min = fsz;
    }
    if (!isFinite(min) || !th) return 0.45;
    /* co hệ số f => chữ nhỏ nhất thành min*f; cần min*f >= th => f >= th/min */
    return Math.max(0.45, Math.min(1, (th * 1.06) / min));   // +6% biên an toàn
  }
  /* Bài này: khối con (.grow/.split/thẻ) tràn nội dung nhưng .slide không cuộn (overflow:hidden)
     -> scrollHeight của .slide không đổi. Đo thêm từng khối để fitStage vẫn co chữ. */
  function innerOverflow(slide) {
    /* so khung LAYOUT (offset*, không bị transform của hiệu ứng .stagger làm lệch) của con trực tiếp
       với khung cha — scrollHeight báo nhầm khi có ảnh co giãn, getBoundingClientRect nhầm khi đang animate */
    var bx = slide.querySelectorAll('.grow, .split > *, .stagecard, .pcard, .card, .clozelist, .clozegrid, .rowwrap > *, .fc-wrap');
    for (var i = 0; i < bx.length; i++) {
      var box = bx[i]; if (!box.offsetHeight) continue;
      var kids = box.children;
      for (var j = 0; j < kids.length; j++) {
        var k = kids[j]; if (!k.offsetHeight) continue;
        var top, bot;
        if (k.offsetParent === box) { top = k.offsetTop; bot = top + k.offsetHeight; if (bot > box.clientHeight + 3 || top < -3) return true; }
        else if (k.offsetParent === box.offsetParent) { top = k.offsetTop; bot = top + k.offsetHeight; if (bot > box.offsetTop + box.offsetHeight + 3 || top < box.offsetTop - 3) return true; }
      }
    }
    return false;
  }
  function fitNow() {
    fitRaf = 0;
    var slide = curSlide();
    if (!slide) return;
    var lo = slide.__floor != null ? slide.__floor : minFit();
    var cur = parseFloat(slide.style.getPropertyValue('--fit'));
    if (!(cur > 0)) cur = 1;
    var guard = 0;
    /* Vòng lặp ĐỒNG BỘ: đọc scrollHeight ép trình duyệt tính lại layout ngay, nên slide
       vừa vào là đã vừa khung — không nhấp nháy 1-2 khung hình. */
    while ((slide.scrollHeight > slide.clientHeight + 1 || innerOverflow(slide)) && cur > lo + 0.001 && guard++ < 16) {
      cur = Math.max(lo, cur - 0.05);
      slide.style.setProperty('--fit', cur.toFixed(3));
    }
    fitTries = guard;
  }
  function scheduleFit() {
    if (fitRaf) return;
    fitRaf = global.requestAnimationFrame ? requestAnimationFrame(fitNow) : setTimeout(fitNow, 16);
  }
  function resetFit() {
    var slide = curSlide();
    if (slide) {
      slide.style.setProperty('--fit', '1');
      slide.__floor = textFloor(slide);
    }
    fitTries = 0;
    fitNow();
    scheduleFit();
  }
  Lab.setBgStyle = function (k) { Lab.bgStyle = k; Lab.__force = true; applyScene(); };
  Lab.fit = scheduleFit;
  Lab.refit = resetFit;

  Lab.goTo = function (id) {
    var i = Engine.slides.findIndex(function (s) { return s.id === id; });
    if (i >= 0) Engine.go(i, 'jump');
  };

  /* ===== 3. NÚT LỚP HỌC: Tập trung / Giảm chuyển động ===== */
  function addNavButtons() {
    var nav = document.querySelector('.navbar');
    if (!nav || nav.querySelector('#focusBtn')) return;
    var anchor = nav.querySelector('#fullscreenBtn') || nav.querySelector('#tlockBtn');
    var mk = function (id, icon, title, cls) {
      var b = document.createElement('button');
      b.className = 'iconbtn'; b.id = id; b.textContent = icon; b.title = title;
      b.addEventListener('click', function () {
        var on = document.body.classList.toggle(cls);
        b.classList.toggle('on', on);
        try { sessionStorage.setItem('pref:' + cls, on ? '1' : '0'); } catch (e) { }
        Engine.toast(title + (on ? ' — ON' : ' — OFF'));
        resetFit();
      });
      try { if (sessionStorage.getItem('pref:' + cls) === '1') { document.body.classList.add(cls); b.classList.add('on'); } } catch (e) { }
      if (anchor) nav.insertBefore(b, anchor); else nav.appendChild(b);
      return b;
    };
    mk('focusBtn', '🎯', 'Focus mode', 'focus');
    mk('motionBtn', '🌀', 'Reduce motion', 'nomotion');
  }

  /* ===== 4. NỐI VÀO ENGINE ===== */
  var origGo = Engine.go;
  Engine.go = function (i, dir) {
    origGo.call(Engine, i, dir);
    applyScene();
    resetFit();
    setTimeout(scheduleFit, 140);
    setTimeout(scheduleFit, 620);
  };
  var origFs = Engine._applyFontScale;
  Engine._applyFontScale = function (v) { origFs.call(Engine, v); resetFit(); };

  var origStart = Engine.start;
  Engine.start = function (cfg) {
    origStart.call(Engine, cfg);
    applyScene();
    addNavButtons();
    resetFit();
    var stage = document.querySelector('.stage');
    if (stage) {
      if (global.ResizeObserver) new ResizeObserver(resetFit).observe(stage);
      else global.addEventListener('resize', resetFit);
      new MutationObserver(scheduleFit).observe(stage, { childList: true, subtree: true, characterData: true });
      stage.addEventListener('load', scheduleFit, true);   // ảnh tải xong -> đo lại
    }
    global.addEventListener('resize', resetFit);
    document.addEventListener('fullscreenchange', resetFit);
  };

  /* ===== 5. LỚP THẨM MỸ: icon SVG, thanh công cụ gọn, nhãn phần =====
     Chạy SAU engine dựng navbar, không sửa engine.js. Tắt từng phần nếu cần:
     Lab.tidyNav = false · Lab.svgIcons = false · Lab.autoEyebrow = false (đặt trong slide đầu). */
  var IC = {
    prev: '<path d="M15 5l-7 7 7 7"/>',
    next: '<path d="M9 5l7 7-7 7"/>',
    expand: '<path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/>',
    shrink: '<path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/>',
    gear: '<circle cx="12" cy="12" r="3.2"/><path d="M12 2.8v2.4M12 18.8v2.4M4.2 7.5l2.1 1.2M17.7 15.3l2.1 1.2M4.2 16.5l2.1-1.2M17.7 8.7l2.1-1.2"/><circle cx="12" cy="12" r="7"/>',
    check: '<path d="M4.5 12.5l4.8 4.8L19.5 7"/>',
    eye: '<path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
    reset: '<path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v4.5h4.5"/>',
    sound: '<path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M15.5 9a4.5 4.5 0 0 1 0 6M18 6.5a8 8 0 0 1 0 11"/>',
    timer: '<circle cx="12" cy="13.5" r="7.5"/><path d="M12 13.5V9.5M9.5 2.5h5"/>',
    play: '<path d="M7 4.5v15l12-7.5z"/>',
    star: '<path d="M12 3.2l2.7 5.6 6.1.8-4.5 4.2 1.1 6.1L12 17l-5.4 2.9 1.1-6.1-4.5-4.2 6.1-.8z"/>',
    undo: '<path d="M9 7L4 12l5 5"/><path d="M4 12h10a6 6 0 0 1 0 12"/>'
  };
  /* Icon vẽ bằng CSS mask (thẻ <i>), KHÔNG chèn <svg> vào DOM: qa.py mục 5 coi mọi <svg> là
     widget và báo "QUÁ NHỎ" oan cho icon trong nút. Màu icon = currentColor của nút. */
  Lab.icon = function (name) {
    var i = document.createElement('i');
    i.className = 'ic'; i.setAttribute('aria-hidden', 'true');
    var svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">' + (IC[name] || '') + '</svg>';
    var url = 'url("data:image/svg+xml;utf8,' + encodeURIComponent(svg) + '")';
    i.style.webkitMaskImage = url; i.style.maskImage = url;
    return i;
  };
  function setIcon(btn, name) { if (!btn) return; btn.textContent = ''; btn.appendChild(Lab.icon(name)); }

  /* Emoji đầu nhãn nút -> icon SVG cùng nghĩa. Emoji không có trong bảng thì để nguyên. */
  var LEAD = [
    [/^\s*(✅|✔️?)\s*/, 'check'], [/^\s*👁️?\s*/, 'eye'], [/^\s*(↺|🔄)\s*/, 'reset'],
    [/^\s*(🔊|🔈)\s*/, 'sound'], [/^\s*(⏱️?)\s*/, 'timer'], [/^\s*(▶️?)\s*/, 'play'], [/^\s*(↩️?)\s*/, 'undo']
  ];
  function iconizeButtons(scope) {
    if (Lab.svgIcons === false || !scope) return;
    scope.querySelectorAll('.btn').forEach(function (b) {
      if (b.querySelector('.ic') || b.children.length) return;
      var t = b.textContent;
      for (var i = 0; i < LEAD.length; i++) {
        if (LEAD[i][0].test(t)) { b.textContent = t.replace(LEAD[i][0], ''); b.insertBefore(Lab.icon(LEAD[i][1]), b.firstChild); return; }
      }
    });
  }
  Lab.iconize = iconizeButtons;

  function tidyNav() {
    if (Lab.tidyNav === false) return;
    var nav = document.querySelector('.navbar');
    if (!nav || nav.querySelector('#tdrawerBtn')) return;
    var byTitle = function (p) { var r = null; nav.querySelectorAll('.iconbtn').forEach(function (b) { if (!r && (b.title || '').indexOf(p) === 0) r = b; }); return r; };
    var prev = byTitle('Previous'), next = byTitle('Next'), full = nav.querySelector('#fullscreenBtn');
    var drawer = dv(''); drawer.id = 'tdrawer';
    var row = function (label, els) {
      els = els.filter(Boolean); if (!els.length) return;
      var r = dv('row'); r.appendChild(dv('lbl', label)); els.forEach(function (e) { r.appendChild(e); }); drawer.appendChild(r);
    };
    row('Text size', [nav.querySelector('.fs-group')]);
    row('Sound', [byTitle('Mute'), nav.querySelector('#voiceBtn')]);
    row('Teams', [nav.querySelector('.teams')]);
    row('Class tools', [byTitle('Timer'), byTitle('Spotlight'), byTitle('Slides')]);
    row('Display', [nav.querySelector('#focusBtn'), nav.querySelector('#motionBtn')]);
    row('Lock', [nav.querySelector('#tlockBtn')]);
    document.body.appendChild(drawer);

    var tb = document.createElement('button');
    tb.id = 'tdrawerBtn'; tb.className = 'iconbtn tbtn'; tb.title = 'Teacher tools';
    tb.appendChild(Lab.icon('gear')); tb.appendChild(document.createTextNode('Teacher'));
    tb.addEventListener('click', function (e) { e.stopPropagation(); drawer.classList.toggle('on'); });
    document.addEventListener('pointerdown', function (e) {
      if (drawer.classList.contains('on') && !drawer.contains(e.target) && !tb.contains(e.target)) drawer.classList.remove('on');
    });
    var anchor = full || prev;
    if (anchor) nav.insertBefore(tb, anchor); else nav.appendChild(tb);

    if (Lab.svgIcons !== false) {
      if (prev) { setIcon(prev, 'prev'); prev.classList.add('nav-arrow'); }
      if (next) { setIcon(next, 'next'); next.classList.add('nav-arrow'); }
      if (full) {
        var sync = function () { setIcon(full, document.fullscreenElement ? 'shrink' : 'expand'); };
        sync(); document.addEventListener('fullscreenchange', function () { setTimeout(sync, 0); });
      }
    }
  }

  /* Nhãn phần (section) nhỏ phía trên tiêu đề — người xem luôn biết đang ở phần nào của bài */
  function addEyebrow() {
    if (Lab.autoEyebrow === false) return;
    var slide = curSlide(); var def = Engine.slides[Engine.idx];
    if (!slide || !def || !def.section || slide.querySelector('.eyebrow, .cover')) return;
    var pill = slide.querySelector(':scope > .pill');
    if (!pill || pill.textContent.toLowerCase().indexOf(def.section.toLowerCase()) >= 0) return;
    var eb = dv('eyebrow fixed', def.section);
    slide.insertBefore(eb, pill);
    /* Nhãn phần là trang trí: slide chật (font 150%, màn dọc) thì bỏ nhãn TRƯỚC khi fitStage phải co chữ */
    var f0 = slide.style.getPropertyValue('--fit');
    slide.style.setProperty('--fit', '1');
    var tight = slide.scrollHeight > slide.clientHeight + 1;
    if (f0) slide.style.setProperty('--fit', f0);
    if (tight || global.innerHeight < 560) eb.remove();
    resetFit();
  }

  var goAes = Engine.go;
  Engine.go = function (i, dir) {
    goAes.call(Engine, i, dir);
    addEyebrow();
    iconizeButtons(document.querySelector('.stage'));
  };
  var startAes = Engine.start;
  Engine.start = function (cfg) {
    startAes.call(Engine, cfg);
    tidyNav();
    addEyebrow();
    iconizeButtons(document.querySelector('.stage'));
    var st = document.querySelector('.stage');
    if (st) new MutationObserver(function () { iconizeButtons(st); }).observe(st, { childList: true, subtree: true });
  };

  /* ===================== 6. RIÊNG BÀI G7 · CHEMISTRY L9 ===================== */

  /* Nền: hình minh hoạ gốc của PPT (giữ theo yêu cầu GV). def.bg: cover | cloud | blue | navy */
  function deco(cls, img, css) {
    var d = dv('deco img ' + cls);
    d.style.backgroundImage = 'url("assets/img/' + img + '")';
    for (var k in css) d.style[k] = css[k];
    return d;
  }
  function scenePPT(key) {
    var sc = dv('scene ppt s-' + key);
    if (key === 'cover') sc.style.backgroundImage = 'url("assets/img/bg-cover.png")';
    else if (key === 'cloud') sc.style.backgroundImage = 'url("assets/img/bg-cloud.png")';
    else {
      sc.appendChild(dv('board'));
      if (key === 'navy') {
        /* như slide "Challenge" gốc: hình 3D ló ra ở mép bảng, 2 nhân vật đứng 2 góc dưới */
        sc.appendChild(deco('drift', 'image16.png', { left: '-1.6vw', top: '-3vh', width: '10vw', height: '10vw' }));
        sc.appendChild(deco('', 'image14.png', { left: '-1.4vw', top: '30vh', width: '8vw', height: '8vw' }));
        sc.appendChild(deco('drift2', 'image17.png', { right: '-1vw', top: '24vh', width: '7.5vw', height: '7.5vw' }));
        sc.appendChild(deco('', 'image18.png', { right: '-1.8vw', top: '-4vh', width: '9vw', height: '9vw' }));
        sc.appendChild(deco('char l', 'image15.png', {}));
        sc.appendChild(deco('char r', 'image13.png', {}));
      } else {
        sc.appendChild(deco('drift2', 'image17.png', { left: '-1.2vw', bottom: '-2vh', width: '8vw', height: '8vw' }));
        sc.appendChild(deco('', 'image14.png', { right: '-1.2vw', top: '-3vh', width: '7vw', height: '7vw' }));
      }
    }
    return sc;
  }

  /* Công thức hoá học: 'H2O' -> H<sub>2</sub>O */
  Lab.chem = function (f) { return '<span class="chem">' + String(f).replace(/(\d+)/g, '<sub>$1</sub>') + '</span>'; };

  /* Câu hỏi 1 lựa chọn: chấm ngay khi bấm (luật 4 — 1 lượt bấm), điểm chỉ tính lần chọn đầu.
     Trả về {el, show, reset} để gắn nút Show answer / Reset. */
  Lab.mcq = function (ctx, opts, answer, onRight) {
    var box = dv('mcq');
    var first = true;
    var btns = opts.map(function (t, i) {
      var b = document.createElement('button'); b.className = 'opt'; b.textContent = t;
      ctx.on(b, 'click', function () {
        btns.forEach(function (x) { ctx.clearResult(x); x.classList.remove('picked'); });
        b.classList.add('picked');
        var ok = i === answer;
        ctx.markResult(b, ok, { sound: !first });
        if (first) { Engine.score(ok ? 1 : 0, 1); first = false; }
        if (ok && onRight) onRight();
      });
      box.appendChild(b);
      return b;
    });
    return {
      el: box,
      show: function () { btns.forEach(function (x) { ctx.clearResult(x); x.classList.remove('picked'); }); btns[answer].classList.add('picked'); ctx.markResult(btns[answer], true, { sound: false }); onRight && onRight(); },
      reset: function () { btns.forEach(function (x) { ctx.clearResult(x); x.classList.remove('picked'); }); }
    };
  };
  Lab.showReset = function (ctx, q, extra) {
    var row = dv('btnrow fixed');
    var bS = document.createElement('button'); bS.className = 'btn btn-show'; bS.textContent = '👁 Show answer';
    var bR = document.createElement('button'); bR.className = 'btn btn-reset'; bR.textContent = '↺ Reset';
    ctx.on(bS, 'click', q.show); ctx.on(bR, 'click', q.reset);
    (extra || []).forEach(function (e) { row.appendChild(e); });
    row.append(bS, bR);
    return row;
  };
  /* Nút quay lại bài đọc (hub câu hỏi) */
  Lab.backBtn = function (ctx, id, label) {
    var b = document.createElement('button'); b.className = 'btn'; b.textContent = '↩ ' + label;
    ctx.on(b, 'click', function () { Lab.goTo(id); });
    return b;
  };

  Lab.ddCheck = function (ctx, dd, zones) {
    var correct = 0;
    dd.tray.querySelectorAll('.drag-item').forEach(function (n) { ctx.clearResult(n); });
    zones.forEach(function (z) {
      var zn = dd.zoneEls[z.id];
      var it = zn.querySelector('.drag-item');
      if (!it) { ctx.clearResult(zn); ctx.markResult(zn, false, { badge: false }); return; }
      ctx.clearResult(zn);
      var ok = z.accept.indexOf(it.dataset.ddId) >= 0;
      if (ok) correct++;
      ctx.markResult(it, ok);
    });
    return { correct: correct, total: zones.length };
  };
  Lab.ddClear = function (ctx, dd) { Object.keys(dd.zoneEls).forEach(function (k) { ctx.clearResult(dd.zoneEls[k]); }); };

  /* Nút phát track audio gốc trong PPT (thẻ <audio> nằm trong slide -> Sound.stopAll() tự dừng khi chuyển slide) */
  Lab.player = function (ctx, src, label) {
    var wrap = document.createElement('span'); wrap.className = 'player';
    var a = document.createElement('audio'); a.src = src; a.preload = 'auto'; a.style.display = 'none';
    var b = document.createElement('button'); b.className = 'btn btn-primary'; b.textContent = '▶ ' + label;
    var bar = document.createElement('span'); bar.className = 'bar';
    var fill = document.createElement('i'); bar.appendChild(fill);
    function setLbl(playing) { b.textContent = (playing ? '❚❚ ' : '▶ ') + label; }
    ctx.on(b, 'click', function () {
      if (!a.paused) { a.pause(); return; }
      if (Sound.muted()) { Engine.toast('Sound is muted'); return; }
      Sound.stopAll();
      try { if (a.ended) a.currentTime = 0; } catch (e) { }
      var p = a.play(); if (p && p.catch) p.catch(function () { Engine.toast('Tap again to play'); });
    });
    ctx.on(a, 'play', function () { setLbl(true); });
    ctx.on(a, 'pause', function () { setLbl(false); });
    ctx.on(a, 'ended', function () { setLbl(false); fill.style.transform = 'scaleX(1)'; });
    ctx.on(a, 'timeupdate', function () { if (a.duration) fill.style.transform = 'scaleX(' + (a.currentTime / a.duration).toFixed(3) + ')'; });
    ctx.on(a, 'error', function () { b.disabled = true; b.textContent = 'Audio unavailable'; });
    /* <audio> gắn vào body (không nằm trong slide) để không tính là phần tử ẩn trong khối nút;
       Sound.stopAll() vẫn tìm thấy và dừng nó, ctx dọn sạch khi rời slide */
    document.body.appendChild(a);
    ctx._off.push(function () { try { a.pause(); } catch (e) { } a.remove(); });
    wrap.append(b, bar);
    return wrap;
  };

})(window);

</script>

  Engine.start({"title": "Lesson 9: Chemical Formula", "accent": "#0A5DA8", "accent2": "#F5B700", "bg": "#F2F8FD", "logo": "assets/img/logo-avs.png", "greeting": "Grade 7 · Chemistry · Let's learn Science in English!"});
</script>
